appId: com.miyakey.grimodex
productName: Grimodex
beforeBuild: ./electron/scripts/beforeBuild.mjs

protocols:
  - name: Grimodex Web Editor handoff
    schemes:
      - grimodex

directories:
  output: release/electron
  buildResources: src-tauri/icons

files:
  - dist/**
  - dist-electron/**
  - package.json
  - electron/native/grimodex-node/grimodex-node.node

asarUnpack:
  - electron/native/grimodex-node/grimodex-node.node

extraResources:
  - from: src-tauri/target/release
    to: bin
    filter:
      - grimodex-mcp
      - grimodex-mcp.exe
  - from: src-tauri/resources/semantic
    to: resources/semantic
    filter:
      - "**/tokenizer.json"
  - from: experiments/lfm25-encoder-phase0/local
    to: resources/reranker
    filter:
      - phase0b/ja_xsmall/**
      - phase0b/en_minilm_l4/**

win:
  target:
    - nsis
  artifactName: "${productName}-${version}-windows-${arch}.${ext}"

nsis:
  include: electron/installer/tauri-v1-migration.nsh

mac:
  target:
    - dmg
    - zip
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
  hardenedRuntime: true

# The release workflow staples the DMG after electron-builder has finished.
# Stapling mutates the DMG bytes, so it must not be referenced by the already
# generated latest-mac.yml. The ZIP remains the sole macOS updater artifact.
dmg:
  writeUpdateInfo: false

linux:
  target:
    - AppImage
    - deb
    - rpm
  artifactName: "${productName}-${version}-linux-${arch}.${ext}"
  category: Office
  syncDesktopName: true

deb:
  packageName: grimodex
  depends:
    - libc6 (>= 2.39)
    - libstdc++6 (>= 12)
    - libgcc-s1
    - libdbus-1-3
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

rpm:
  packageName: grimodex
  fpm:
    - --rpm-posttrans=packaging/linux/rpm-posttrans.sh
  depends:
    - glibc >= 2.39
    - libstdc++
    - libgcc
    - dbus-libs
    - libsecret
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - (libXtst or libXtst6)
    - xdg-utils
    - at-spi2-core
    - (libuuid or libuuid1)

publish:
  provider: github
  owner: kazormia296
  repo: Grimodex
