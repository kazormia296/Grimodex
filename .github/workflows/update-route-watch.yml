name: Update route watch

# H1（K3/3）: 公開 release の asset の redirect 先の host が RS-1 の GitHub 3 host
# （electron/main/rendererContainment.ts の RS1_GITHUB_HOSTS）に含まれるかを週 1 回
# 確かめる。検知だけを行い、含まれなければ job を失敗させる（RS-1 は変えない）。
# 要求先は GitHub の公開 asset だけで、利用者のデータを運ばず、secrets を使わない。
# 判断の記録: docs/plans/nir1-lane-decisions/cp2b-decisions.md の DR-CP2B-P3-1〜4。

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-route-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Check update redirect hosts against RS-1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check the update redirect route
        run: node scripts/update-route-redirect-check.mjs
