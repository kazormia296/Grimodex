# dev 専用の実験（claude/dev-perf-gpu-experiment 枝だけ。master に merge しない）。
# ci.yml の electron-runtime-performance が AWS の hosted runner で最初のフレームが数秒遅れて
# 落ちる原因（GPU process／I/O／VM）を切り分けるため、描画の起動引数を変えた 4 通りで同じ測定を
# 5 回ずつ流し、分布を比べる。gate・閾値・製品のコードは変えない。
# 集計: gh run download <run id> -D <dir> のあと
#   node scripts/dev-perf-gpu-experiment-aggregate.mjs <dir>
name: Dev perf GPU experiment

on:
  push:
    branches: [claude/dev-perf-gpu-experiment]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-perf-gpu-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ci.yml の electron-product-journeys-build と同じ手順で、測定が使う N-API module と
  # production の app だけを作る（MCP sidecar と C2-ZC fixture は測定に使わないので省く）。
  # job id を ci.yml と同じにして、Swatinem/rust-cache（key に job id を含む）が master の cache を
  # 読めるようにする。
  electron-product-journeys-build:
    name: Build (N-API / app)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Native build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libdbus-1-dev \
            libsecret-1-dev \
            pkg-config

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            src-tauri
            electron/native/grimodex-node
          key: electron-product-journeys

      - run: pnpm install --frozen-lockfile

      - name: Build native module and production Electron app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm napi:build
          pnpm electron:build

      - name: Package build outputs
        run: |
          set -euo pipefail
          # tar keeps the executable bits that the artifact upload would drop.
          tar -cf "$RUNNER_TEMP/product-journey-build.tar" \
            dist dist-electron electron/native/grimodex-node/grimodex-node.node

      - name: Upload build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-perf-gpu-build-${{ github.run_id }}
          path: ${{ runner.temp }}/product-journey-build.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  measure:
    name: ${{ matrix.variant }} rep${{ matrix.rep }}
    needs: electron-product-journeys-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 実験の job は落ちても workflow を赤にしない（結果は artifact と要約で見る）。
    continue-on-error: true
    strategy:
      fail-fast: false
      # 共有の hosted runner の枠を空けるため同時に 4 本まで。rep を外側にして、同時に走る 4 本が
      # 同じ rep の 4 variant になるようにする（時間帯・runner の当たり外れを variant 間で揃える）。
      max-parallel: 4
      matrix:
        rep: [1, 2, 3, 4, 5]
        variant: [baseline, angle-swiftshader, swiftshader-full, in-process-gpu]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install pinned Electron binary
        run: node scripts/ensure-electron-binary.mjs

      - name: Electron system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Download shared native module and production Electron app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dev-perf-gpu-build-${{ github.run_id }}
          path: ${{ runner.temp }}/product-journey-build

      - name: Restore shared native module and production Electron app
        run: tar -xf "$RUNNER_TEMP/product-journey-build/product-journey-build.tar"

      # variant ごとの追加起動引数は smoke.mjs の許可の一覧（この 4 通りだけ）で検査される。
      - name: Select variant and record runner identity
        env:
          VARIANT: ${{ matrix.variant }}
          REP: ${{ matrix.rep }}
        run: |
          set -euo pipefail
          case "$VARIANT" in
            baseline) extra="" ;;
            angle-swiftshader) extra="--use-angle=swiftshader" ;;
            swiftshader-full) extra="--use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist" ;;
            in-process-gpu) extra="--in-process-gpu" ;;
            *) echo "unknown variant: $VARIANT" >&2; exit 1 ;;
          esac
          echo "GRIMODEX_DEV_PERF_EXTRA_ELECTRON_ARGS=$extra" >> "$GITHUB_ENV"
          mkdir -p .artifacts/electron-runtime-performance
          # 外へは問い合わせない（instance metadata も取らない）。runner 内の読み取りだけ。
          EXTRA_ARGS="$extra" node - <<'EOF'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const read = (file) => {
            try {
              return fs.readFileSync(file, "utf8").trim();
            } catch {
              return "";
            }
          };
          const run = (command, args) => {
            try {
              return execFileSync(command, args, { encoding: "utf8" }).trim();
            } catch {
              return "";
            }
          };
          const identity = {
            schemaVersion: 1,
            variant: process.env.VARIANT,
            rep: Number(process.env.REP),
            extraElectronArgs: process.env.EXTRA_ARGS,
            run: {
              id: process.env.GITHUB_RUN_ID ?? null,
              attempt: process.env.GITHUB_RUN_ATTEMPT ?? null,
              sha: process.env.GITHUB_SHA ?? null,
            },
            sysVendor: read("/sys/class/dmi/id/sys_vendor"),
            productName: read("/sys/class/dmi/id/product_name"),
            boardVendor: read("/sys/class/dmi/id/board_vendor"),
            nproc: Number(run("nproc", [])) || null,
            freeMegabytes: run("free", ["-m"]),
            kernel: run("uname", ["-r"]),
            imageVersion: process.env.ImageVersion ?? null,
          };
          fs.writeFileSync(
            ".artifacts/electron-runtime-performance/dev-perf-experiment.json",
            `${JSON.stringify(identity, null, 2)}\n`,
          );
          console.log(JSON.stringify(identity));
          EOF

      # ci.yml と同じ測定（--retry-transient-once も同じ）。落ちても後の step を続ける。
      - name: 50k-character / 20-Beat runtime performance measurement
        id: runtime-performance
        continue-on-error: true
        env:
          GRIMODEX_PERF_CAPTURE_BUILD_IDENTITY: "1"
        # 出力を measure.log にも残す：smoke は最後の phase まで通らないと metrics file を書かないため、
        # 途中で落ちた job の coldStart は log の [runtime-perf] 行から拾う。
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm electron:perf:ci 2>&1 \
            | tee .artifacts/electron-runtime-performance/measure.log

      # ci.yml の「Runner-bound Electron runtime diagnostic (failure only)」は写さない：失敗時に
      # 測定をもう 1 回走らせるため、分布に別の測定が混ざる。

      - name: Summarize result
        if: always()
        continue-on-error: true
        env:
          MEASURE_OUTCOME: ${{ steps.runtime-performance.outcome }}
        run: |
          node scripts/dev-perf-gpu-experiment-aggregate.mjs \
            --summary-line .artifacts/electron-runtime-performance \
            --outcome "$MEASURE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-perf-gpu-${{ matrix.variant }}-rep${{ matrix.rep }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/electron-runtime-performance/
          if-no-files-found: error
          retention-days: 7
