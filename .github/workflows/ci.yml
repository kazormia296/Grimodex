name: CI

on:
  # Automatic PR, push, and scheduled runs are paused while this source
  # repository is private. Keep explicit/manual and release-call entrypoints
  # available so an operator can resume CI deliberately when needed.
  workflow_dispatch:
    inputs:
      product_journey_mode:
        description: Product journey selection mode
        required: true
        type: choice
        default: all
        options:
          - all
          - shadow
      independent_gates:
        description: Run 10 independent normal jobs including 3OS workers; defer runtime/journeys and native/shared/migration jobs (not complete CI)
        required: false
        type: boolean
        default: false
      source_focused:
        description: Run source repair contracts and generate license notices (not canonical CI)
        required: false
        type: boolean
        default: false
      source_resolve_sharp:
        description: Resolve sharp lock repair source (requires source_focused; not acceptance)
        required: false
        type: boolean
        default: false
      source_audit_compat:
        description: Audit patched dependencies and exercise sharp consumers (requires source_focused; not canonical CI)
        required: false
        type: boolean
        default: false
      source_canonical_contracts:
        description: Canonical adapter source contracts only (requires source_focused; no gates or generation)
        required: false
        type: boolean
        default: false
      canonical_profile:
        description: Empty preserves ordinary CI; contracts/quick/full selects canonical CI; shared-rust selects the existing Rust job only; os-contracts/os-check selects existing Linux helper source/check only
        required: false
        type: string
        default: ""
      candidate_base:
        description: Immutable base SHA for canonical quick/full only
        required: false
        type: string
      candidate_head:
        description: Immutable head SHA for canonical quick/full only, equal to dispatched ref
        required: false
        type: string
      max_parallel_tasks:
        description: Canonical scheduler option (empty uses existing default 12)
        required: false
        type: string
  workflow_call:
    inputs:
      product_journey_mode:
        description: Product journey selection mode
        required: false
        type: string
        default: all

permissions:
  contents: read

jobs:
  existing-os-suitability:
    if: ${{ startsWith(inputs.canonical_profile, 'os-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate existing OS suitability selection
        id: os-selection
        env:
          OS_SUITABILITY: ${{ inputs.canonical_profile }}
          PRODUCT_JOURNEY_MODE: ${{ inputs.product_journey_mode }}
          INDEPENDENT_GATES: ${{ inputs.independent_gates }}
          SOURCE_FOCUSED: ${{ inputs.source_focused }}
          SOURCE_RESOLVE_SHARP: ${{ inputs.source_resolve_sharp }}
          SOURCE_AUDIT_COMPAT: ${{ inputs.source_audit_compat }}
          SOURCE_CANONICAL_CONTRACTS: ${{ inputs.source_canonical_contracts }}
          CANDIDATE_BASE: ${{ inputs.candidate_base }}
          CANDIDATE_HEAD: ${{ inputs.candidate_head }}
          MAX_PARALLEL_TASKS: ${{ inputs.max_parallel_tasks }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          case "$OS_SUITABILITY" in os-contracts|os-check) ;; *) exit 1 ;; esac
          test "$PRODUCT_JOURNEY_MODE" = all
          for flag in "$INDEPENDENT_GATES" "$SOURCE_FOCUSED" "$SOURCE_RESOLVE_SHARP" "$SOURCE_AUDIT_COMPAT" "$SOURCE_CANONICAL_CONTRACTS"; do
            case "$flag" in false|"") ;; *) exit 1 ;; esac
          done
          test -z "$CANDIDATE_BASE$CANDIDATE_HEAD$MAX_PARALLEL_TASKS"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record existing OS suitability checkout identity
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .artifacts/ci
          COMMIT_SHA="$(git rev-parse HEAD)"
          TREE_SHA="$(git rev-parse HEAD^{tree})"
          test "$COMMIT_SHA" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          printf '%s\n' "{\"commitSha\":\"${COMMIT_SHA}\",\"treeSha\":\"${TREE_SHA}\",\"event\":\"${GITHUB_EVENT_NAME}\",\"ref\":\"${GITHUB_REF}\",\"sha\":\"${GITHUB_SHA}\"}" > .artifacts/ci/checkout-identity.json

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: inputs.canonical_profile == 'os-contracts'
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: inputs.canonical_profile == 'os-contracts'
        with:
          node-version: 22
          cache: pnpm

      - if: inputs.canonical_profile == 'os-contracts'
        run: pnpm install --frozen-lockfile

      - name: Existing OS suitability source contracts
        if: inputs.canonical_profile == 'os-contracts'
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .artifacts/ci-os-source
          node --test --test-name-pattern='existing OS suitability|registered CI exposes only opt-in|registered canonical reuse|manual source-focused repair' scripts/ci-pause.test.mjs scripts/existing-os-suitability.test.mjs | tee .artifacts/ci-os-source/contracts.tap

      - name: One existing namespace permission and harmless behavior check
        if: inputs.canonical_profile == 'os-check'
        run: node scripts/existing-os-suitability.mjs

      - name: Upload existing OS suitability source-shaped evidence
        if: always() && steps.os-selection.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-os-suitability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/ci/checkout-identity.json
            .artifacts/ci-os-source/contracts.tap
            .artifacts/ci-os-suitability/namespace-check-intent.json
            .artifacts/ci-os-suitability/result.json
            .artifacts/ci-os-suitability/late-close.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # Local reusable calls load the callee at this same commit, without requiring
  # the branch-only canonical adapter to be registered for manual dispatch.
  canonical:
    if: ${{ !startsWith(inputs.canonical_profile, 'os-') && inputs.canonical_profile != 'shared-rust' && (inputs.canonical_profile || inputs.candidate_base || inputs.candidate_head || inputs.max_parallel_tasks) }}
    uses: ./.github/workflows/canonical-ci.yml
    with:
      # Mixed modes go to the sole owner for rejection before setup; ordinary
      # jobs below exclude any canonical request even when that request is bad.
      profile: ${{ !inputs.independent_gates && !inputs.source_focused && !inputs.source_resolve_sharp && !inputs.source_audit_compat && !inputs.source_canonical_contracts && inputs.product_journey_mode == 'all' && inputs.canonical_profile || 'invalid' }}
      candidate_base: ${{ inputs.candidate_base || '' }}
      candidate_head: ${{ inputs.candidate_head || '' }}
      max_parallel_tasks: ${{ inputs.max_parallel_tasks || '12' }}

  quality:
    name: Quality (traceability / impact-selected light gates)
    if: github.event_name != 'schedule' && !inputs.source_focused && !inputs.source_canonical_contracts && !inputs.canonical_profile && !inputs.candidate_base && !inputs.candidate_head && !inputs.max_parallel_tasks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Record checkout identity for Gate B2
        run: |
          mkdir -p .artifacts/ci
          COMMIT_SHA="$(git rev-parse HEAD)"
          TREE_SHA="$(git rev-parse HEAD^{tree})"
          printf '%s\n' "{\"commitSha\":\"${COMMIT_SHA}\",\"treeSha\":\"${TREE_SHA}\",\"event\":\"${GITHUB_EVENT_NAME}\",\"ref\":\"${GITHUB_REF}\",\"sha\":\"${GITHUB_SHA}\"}" \
            > .artifacts/ci/checkout-identity.json
          echo "checkout commit=${COMMIT_SHA} tree=${TREE_SHA} event=${GITHUB_EVENT_NAME} github.sha=${GITHUB_SHA}"

      - name: Upload checkout identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkout-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ci/checkout-identity.json
          if-no-files-found: error

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
          key: quality-grimodex-ai

      - run: pnpm install --frozen-lockfile

      - name: Quality model and selector contracts
        env:
          GATE_B2_WORKTREE_SMOKE: "1"
        run: pnpm verify:quality

      - name: Impact-selected light gates
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          QUALITY_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$QUALITY_BASE_SHA" ]; then
            pnpm eval:impact -- --base "$QUALITY_BASE_SHA" --head "$QUALITY_HEAD_SHA" --run
          else
            pnpm eval:impact -- --head "$QUALITY_HEAD_SHA" --run
          fi

  frontend:
    name: Frontend (type-check / lint / test)
    if: github.event_name != 'schedule' && !inputs.source_focused && !inputs.source_canonical_contracts && !inputs.canonical_profile && !inputs.candidate_base && !inputs.candidate_head && !inputs.max_parallel_tasks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared workspace dependencies
        run: pnpm build:workspace:dependencies

      - name: 型チェック
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Architecture boundary baseline
        run: pnpm validate:architecture

      - name: Browser CI performance contracts
        run: pnpm test:browser-ci

      - name: テスト
        run: pnpm test:node --run

      - name: Web Editor-only production artifact
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build:web-editor

  lfm-encoder-phase0:
    name: LFM Encoder Phase 0 (contracts / offline unit tests)
    if: github.event_name != 'schedule' && !inputs.source_focused && !inputs.source_canonical_contracts && !inputs.canonical_profile && !inputs.candidate_base && !inputs.candidate_head && !inputs.max_parallel_tasks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/lfm25-encoder-phase0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.29
          enable-cache: true
          cache-dependency-glob: experiments/lfm25-encoder-phase0/uv.lock

      - name: Sync fixed CPU environment
        run: uv sync --frozen --extra cpu

      - name: Unit and contract tests
        run: uv run --frozen --extra cpu pytest

      - name: Public dataset contracts
        run: uv run --frozen --extra cpu python tools/validate_dataset.py data/public

  browser:
    name: Browser (Vitest browser)
    if: github.event_name != 'schedule' && !inputs.source_focused && !inputs.source_canonical_contracts && !inputs.canonical_profile && !inputs.candidate_base && !inputs.candidate_head && !inputs.max_parallel_tasks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared workspace dependencies
        run: pnpm build:workspace:dependencies

      - name: Chromium バイナリキャッシュ
        id: pw-cache
        uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-chromium

      - name: Playwright Chromium + システム依存をインストール
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: システム依存のみインストール (キャッシュヒット時)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Browser tests with resource metrics
        run: pnpm benchmark:browser-ci -- --suite browser --runs 1 --output .artifacts/browser-ci/browser.json

      - name: Upload Browser performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-ci-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/browser-ci/browser.json
          if-no-files-found: error
          retention-days: 14

  webgl:
    name: WebGL (deterministic SwiftShader)
    if: github.event_name != 'schedule' && !inputs.source_focused && !inputs.source_canonical_contracts && !inputs.canonical_profile && !inputs.candidate_base && !inputs.candidate_head && !inputs.max_parallel_tasks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared workspace dependencies
        run: pnpm build:workspace:dependencies

      - name: Chromium binary cache
        id: pw-cache
        uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-chromium

      - name: Install Playwright Chromium and system dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Zen shader research WebGL contracts
        run: pnpm test:zen-shader-webgl --run

      - name: Deterministic WebGL tests with resource metrics
        run: pnpm benchmark:browser-ci -- --suite webgl --runs 1 --file-parallelism false --max-workers 1 --output .artifacts/browser-ci/webgl.json

      - name: Upload WebGL performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webgl-ci-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/browser-ci/webgl.json
          if-no-files-found: error
          retention-days: 14

  storybook:
    name: Storybook (Vitest browser)
    if: github.event_name != 'schedule' && !inputs.source_focused && !inputs.source_canonical_contracts && !inputs.canonical_profile && !inputs.candidate_base && !inputs.candidate_head && !inputs.max_parallel_tasks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared workspace dependencies
        run: pnpm build:workspace:dependencies

      - name: Chromium バイナリキャッシュ
        id: pw-cache
        uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-chromium

      - name: Playwright Chromium + システム依存をインストール
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: システム依存のみインストール (キャッシュヒット時)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Storybook tests with resource metrics
        run: pnpm benchmark:browser-ci -- --suite storybook --runs 1 --output .artifacts/browser-ci/storybook.json

      - name: Upload Storybook performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-ci-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/browser-ci/storybook.json
          if-no-files-found: error
          retention-days: 14

  security:
    name: Security (audit)
    if: github.event_name != 'schedule' && !inputs.source_focused && !inputs.source_canonical_contracts && !inputs.canonical_profile && !inputs.candidate_base && !inputs.candidate_head && !inputs.max_parallel_tasks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: node scripts/pnpm-audit.mjs

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit shared Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Audit Electron native dependencies
        run: cargo audit --file electron/native/grimodex-node/Cargo.lock

  electron:
    name: Electron (workflow contract / type-check / test / build)
    if: github.event_name != 'schedule' && !inputs.canonical_profile && !inputs.candidate_base && !inputs.candidate_head && !inputs.max_parallel_tasks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate canonical contracts selection
        if: inputs.source_canonical_contracts
        env:
          SOURCE_FOCUSED: ${{ inputs.source_focused }}
          SOURCE_RESOLVE_SHARP: ${{ inputs.source_resolve_sharp }}
          SOURCE_AUDIT_COMPAT: ${{ inputs.source_audit_compat }}
        run: |
          set -euo pipefail
          test "$SOURCE_FOCUSED" = true
          test "$SOURCE_RESOLVE_SHARP" != true
          test "$SOURCE_AUDIT_COMPAT" != true

      - name: Validate audit compatibility selection
        if: inputs.source_audit_compat
        env:
          SOURCE_FOCUSED: ${{ inputs.source_focused }}
          SOURCE_RESOLVE_SHARP: ${{ inputs.source_resolve_sharp }}
        run: test "$SOURCE_FOCUSED" = true && test "$SOURCE_RESOLVE_SHARP" != true

      - name: Validate sharp repair selection
        if: inputs.source_resolve_sharp
        env:
          SOURCE_FOCUSED: ${{ inputs.source_focused }}
        run: test "$SOURCE_FOCUSED" = true

      - name: Resolve sharp lock repair source
        if: inputs.source_focused && inputs.source_resolve_sharp
        run: |
          mkdir -p .artifacts/ci-source-focused
          cp pnpm-lock.yaml .artifacts/ci-source-focused/sharp-before.yaml
          pnpm update sharp --depth Infinity --lockfile-only --ignore-scripts

      - id: install
        run: pnpm install --frozen-lockfile

      - name: Verify sharp repair graph
        if: inputs.source_focused && inputs.source_resolve_sharp
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import yaml from 'js-yaml';
          function verify(lock) {
            const sharp = Object.keys(lock.packages).filter((key) => key.startsWith('sharp@'));
            assert.deepEqual(sharp, ['sharp@0.35.5']);
            assert.equal(lock.packages[sharp[0]].resolution.integrity, 'sha512-Ywn4OnzGukp7CDMrp08RQ50YKmuwG47brZgIVPTvBaaAfQlRlygrRqSrxdCiL9M+LlzLBiJ68IR1QqvzHyjC7g==');
            const platforms = Object.keys(lock.packages).filter((key) => key.startsWith('@img/sharp-'));
            assert.ok(platforms.length > 0);
            for (const key of platforms) assert.ok(key.endsWith(key.startsWith('@img/sharp-libvips-') ? '@1.3.4' : '@0.35.5'), key);
            const consumers = {};
            for (const name of ['miniflare', 'vite-imagetools']) {
              const snapshots = Object.entries(lock.snapshots).filter(([key]) => key.startsWith(`${name}@`));
              assert.equal(snapshots.length, 1, name);
              for (const [key, value] of snapshots) {
                const dependency = value.dependencies.sharp;
                assert.equal(dependency.split('(')[0], '0.35.5', key);
                assert.ok(Object.hasOwn(lock.snapshots, `sharp@${dependency}`), key);
                consumers[key] = dependency;
              }
            }
            return { sharp, platforms, consumers };
          }
          assert.throws(() => verify(yaml.load(readFileSync('.artifacts/ci-source-focused/sharp-before.yaml', 'utf8'))));
          const graph = verify(yaml.load(readFileSync('pnpm-lock.yaml', 'utf8')));
          writeFileSync('.artifacts/ci-source-focused/sharp-graph.json', `${JSON.stringify(graph, null, 2)}\n`);
          NODE

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: inputs.source_focused && !inputs.source_audit_compat
        with:
          toolchain: stable

      - name: Record source-focused checkout identity
        if: inputs.source_focused
        run: |
          mkdir -p .artifacts/ci-source-focused
          COMMIT_SHA="$(git rev-parse HEAD)"
          TREE_SHA="$(git rev-parse HEAD^{tree})"
          printf '%s\n' "{\"commitSha\":\"${COMMIT_SHA}\",\"treeSha\":\"${TREE_SHA}\",\"event\":\"${GITHUB_EVENT_NAME}\",\"ref\":\"${GITHUB_REF}\",\"sha\":\"${GITHUB_SHA}\"}" \
            > .artifacts/ci-source-focused/checkout-identity.json

      - name: Canonical connection source contracts
        id: source-canonical-contracts
        if: inputs.source_focused && inputs.source_canonical_contracts
        run: |
          set -euo pipefail
          mkdir -p .artifacts/canonical-source
          node --test scripts/ci-pause.test.mjs scripts/local-ci.test.mjs scripts/local-ci-runner.test.mjs scripts/local-ci-process-supervisor.test.mjs | tee .artifacts/canonical-source/contracts.tap

      - name: Upload canonical connection source contracts
        if: always() && inputs.source_focused && inputs.source_canonical_contracts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/ci-source-focused/checkout-identity.json
            .artifacts/canonical-source/contracts.tap
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Source-focused contracts (before generation)
        id: source-focused-contracts
        if: inputs.source_focused && !inputs.source_audit_compat && !inputs.source_canonical_contracts
        run: |
          set -euo pipefail
          node --test \
            scripts/ci-pause.test.mjs \
            scripts/local-ci.test.mjs \
            scripts/local-ci-runner.test.mjs \
            scripts/local-ci-process-supervisor.test.mjs \
            scripts/electron-product-journeys.test.mjs \
            scripts/generate-licenses.test.mjs \
            scripts/license-policy.test.mjs \
            | tee .artifacts/ci-source-focused/contracts.tap

      # Keep a stale-copy test failure visible. Generated files are repair source,
      # not acceptance of this now-dirty checkout or a canonical Quick/Full pass.
      - name: Generate license repair source
        if: >-
          inputs.source_focused && !inputs.source_audit_compat && !cancelled() &&
          !inputs.source_canonical_contracts && steps.install.outcome == 'success' &&
          (steps.source-focused-contracts.outcome == 'success' ||
           steps.source-focused-contracts.outcome == 'failure')
        run: pnpm generate:licenses

      - name: Upload source-focused repair evidence
        if: always() && inputs.source_focused && !inputs.source_audit_compat && !inputs.source_canonical_contracts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-source-focused-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .artifacts/ci-source-focused/checkout-identity.json
            .artifacts/ci-source-focused/contracts.tap
            .artifacts/ci-source-focused/sharp-graph.json
            pnpm-lock.yaml
            THIRD_PARTY_LICENSES.md
            public/THIRD_PARTY_LICENSES.md
          if-no-files-found: error
          retention-days: 14

      - name: Audit and real sharp consumer compatibility
        if: inputs.source_focused && inputs.source_audit_compat
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFile } from 'node:fs/promises';
          import { runLocalCiCommand } from './scripts/local-ci-process-supervisor.mjs';
          const controller = new AbortController();
          const abort = () => controller.abort();
          process.once('SIGINT', abort);
          process.once('SIGTERM', abort);
          try {
            for (const [taskId, args, timeoutMs] of [
              ['sharp-consumers', ['--test', 'scripts/ci-pause.test.mjs', 'scripts/sharp-consumers.test.mjs'], 300000],
              ['pnpm-audit', ['scripts/pnpm-audit.mjs'], 600000],
            ]) {
              const result = await runLocalCiCommand({ command: 'node', args, timeoutMs }, {
                root: process.cwd(),
                logDirectory: '.artifacts/ci-source-focused/audit-compat',
                taskId, signal: controller.signal, closeGraceMs: 2000,
              }).catch(async (error) => {
                try {
                  if (error.result) {
                    await writeFile(`.artifacts/ci-source-focused/audit-compat/${taskId}.json`, `${JSON.stringify(error.result, null, 2)}\n`);
                  }
                } finally {
                  // Unknown close retains ownership; late cleanup never makes this task pass.
                  if (error.lateClose) {
                    const late = await error.lateClose;
                    await writeFile(`.artifacts/ci-source-focused/audit-compat/${taskId}.late-close.json`, `${JSON.stringify(late, null, 2)}\n`);
                  }
                }
                throw error;
              });
              await writeFile(`.artifacts/ci-source-focused/audit-compat/${taskId}.json`, `${JSON.stringify(result, null, 2)}\n`);
              console.log(`${taskId}: exit=${result.exitCode} cleanup=${result.cleanup.complete} termination=${result.termination}`);
              assert.equal(result.exitCode, 0, taskId);
              assert.equal(result.timedOut, false, taskId);
              assert.equal(result.interrupted, false, taskId);
              assert.equal(result.cleanup.complete, true, taskId);
              assert.equal(result.closeObserved, true, taskId);
              assert.equal(result.termination, 'close-and-group-exit-observed', taskId);
            }
          } finally {
            process.removeListener('SIGINT', abort);
            process.removeListener('SIGTERM', abort);
          }
          NODE

      - name: Upload audit compatibility evidence
        if: always() && inputs.source_focused && inputs.source_audit_compat
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-audit-compat-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .artifacts/ci-source-focused/checkout-identity.json
            .artifacts/ci-source-focused/audit-compat/
          if-no-files-found: error
          retention-days: 14

      - name: Release workflow and manifest contract tests
        if: ${{ !inputs.source_focused }}
        run: >-
          node --test
          scripts/validate-release-version.test.mjs
          scripts/resolve-release-workflow.test.mjs
          scripts/compose-github-release-notes.test.mjs
          scripts/generate-tauri-bridge-manifest.test.mjs
          scripts/release-workflows.test.mjs
          scripts/arch-electron-package.test.mjs
          scripts/linux-release-abi.test.mjs
          scripts/verify-electron-updater-metadata.test.mjs
          scripts/windows-release-workflow.test.mjs
          scripts/electron-v2-cleanup.test.mjs
          scripts/electron-runtime-performance-workflow.test.mjs
          scripts/impact/core.test.mjs
          scripts/product-journey-impact.test.mjs
          scripts/product-journey-ratchet-hardening.test.mjs
          scripts/product-journey-explicit-all.test.mjs
          scripts/product-journey-backlog.test.mjs
          scripts/product-journey-mcp-client.test.mjs
          scripts/electron-product-journey-results.test.mjs
          scripts/electron-product-journey-cleanup-results.test.mjs
          scripts/electron-product-journeys.test.mjs
          scripts/generate-licenses.test.mjs
          scripts/license-policy.test.mjs
          scripts/semantic-reranker-release.test.mjs

      - name: Electron type-check
        if: ${{ !inputs.source_focused }}
        run: pnpm exec tsc -p electron/tsconfig.json --noEmit

      - name: Electron tests
        if: ${{ !inputs.source_focused }}
        run: pnpm test:electron --run

      - name: Electron production build
        if: ${{ !inputs.source_focused }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm electron:build

      - name: Renderer performance budget
        if: ${{ !inputs.source_focused }}
        run: pnpm perf:budget

  electron-runtime-performance:
    name: Electron runtime performance (50k chars / 20 Beats)
    if: github.event_name != 'schedule' && !inputs.source_focused && !inputs.source_canonical_contracts && !inputs.canonical_profile && !inputs.candidate_base && !inputs.candidate_head && !inputs.max_parallel_tasks && !inputs.independent_gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Native build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libdbus-1-dev \
            libsecret-1-dev \
            pkg-config

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            src-tauri
            electron/native/grimodex-node
          key: electron-runtime-performance

      - run: pnpm install --frozen-lockfile

      - name: Install pinned Electron binary
        run: node scripts/ensure-electron-binary.mjs

      - name: Electron runtime performance contracts
        run: pnpm test:electron-perf

      - name: Electron system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Build development native module and production Electron app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm napi:build
          pnpm electron:build

      - name: 50k-character / 20-Beat runtime performance gate
        id: runtime-performance
        env:
          GRIMODEX_PERF_CAPTURE_BUILD_IDENTITY: "1"
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm electron:perf:ci

      - name: Runner-bound Electron runtime diagnostic (failure only)
        if: ${{ failure() && steps.runtime-performance.outcome == 'failure' }}
        env:
          GRIMODEX_REQUIRED_RUNTIME_GATE_OUTCOME: ${{ steps.runtime-performance.outcome }}
        run: node electron/scripts/runtime-performance-diagnostic.mjs

      - name: Upload Electron runtime performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electron-runtime-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/electron-runtime-performance/
          if-no-files-found: error
          retention-days: 14

  electron-product-journeys:
    name: Electron product journeys (persistence / workspace authority)
    if: ${{ !inputs.source_focused && !inputs.source_canonical_contracts && !inputs.canonical_profile && !inputs.candidate_base && !inputs.candidate_head && !inputs.max_parallel_tasks && !inputs.independent_gates }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      GRIMODEX_PRODUCT_JOURNEY_ARTIFACT_DIR: .artifacts/product-journeys
      GRIMODEX_C2ZC_RUST_RECEIPT_PATH: .artifacts/local-ci/c2-zc-rust-acceptance.json
      GRIMODEX_C2ZC_RUST_REQUESTED_BASE: origin/master
      GRIMODEX_C2ZC_RUST_REQUESTED_HEAD: HEAD
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Select product journeys
        id: product-journey-impact
        env:
          PRODUCT_JOURNEY_MODE: >-
            ${{
              inputs.product_journey_mode ||
              (github.event_name == 'schedule' && 'all') ||
              (github.event_name == 'pull_request' && 'shadow') ||
              (github.event_name == 'push' &&
               github.ref == 'refs/heads/master' && 'shadow') ||
              'all'
            }}
          PRODUCT_JOURNEY_BASE_SHA: >-
            ${{
              (github.event_name == 'pull_request' &&
               github.event.pull_request.base.sha) ||
              (github.event_name == 'push' &&
               github.ref == 'refs/heads/master' &&
               github.event.before) ||
              ''
            }}
          PRODUCT_JOURNEY_HEAD_SHA: >-
            ${{
              (github.event_name == 'pull_request' &&
               github.event.pull_request.head.sha) ||
              github.sha
            }}
        run: |
          set -euo pipefail
          selector_args=(
            --mode "$PRODUCT_JOURNEY_MODE"
            --head "$PRODUCT_JOURNEY_HEAD_SHA"
            --report "$GRIMODEX_PRODUCT_JOURNEY_ARTIFACT_DIR/impact.json"
          )
          if [[ -n "$PRODUCT_JOURNEY_BASE_SHA" ]]; then
            selector_args+=(--base "$PRODUCT_JOURNEY_BASE_SHA")
          fi
          node electron/scripts/product-journey-impact.mjs "${selector_args[@]}"

      - name: Native build dependencies
        if: steps.product-journey-impact.outputs.should_run == 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libdbus-1-dev \
            libsecret-1-dev \
            pkg-config

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.product-journey-impact.outputs.should_run == 'true'
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.product-journey-impact.outputs.should_run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: steps.product-journey-impact.outputs.should_run == 'true'
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        if: steps.product-journey-impact.outputs.should_run == 'true'
        with:
          workspaces: |
            src-tauri
            electron/native/grimodex-node
          key: electron-product-journeys

      - if: steps.product-journey-impact.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install pinned Electron binary
        if: steps.product-journey-impact.outputs.should_run == 'true'
        run: node scripts/ensure-electron-binary.mjs

      - name: Electron system dependencies
        if: steps.product-journey-impact.outputs.should_run == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build native module and production Electron app
        if: steps.product-journey-impact.outputs.should_run == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm napi:build
          pnpm electron:build

      - name: Build selected MCP journey dependency
        if: >-
          steps.product-journey-impact.outputs.should_run == 'true' &&
          contains(fromJSON(steps.product-journey-impact.outputs.execution_capabilities), 'mcp')
        run: pnpm mcp:build

      - name: Candidate-bound C2-ZC Rust acceptance gate
        if: steps.product-journey-impact.outputs.should_run == 'true'
        env:
          CARGO_BUILD_JOBS: "2"
          RUST_TEST_THREADS: "2"
        run: |
          node scripts/c2zc-rust-acceptance-receipt.mjs \
            --base "$GRIMODEX_C2ZC_RUST_REQUESTED_BASE" \
            --head "$GRIMODEX_C2ZC_RUST_REQUESTED_HEAD" \
            --output "$GRIMODEX_C2ZC_RUST_RECEIPT_PATH"

      - name: Build and verify candidate-bound C2-ZC restore fixture
        id: c2zc-restore-fixture
        if: steps.product-journey-impact.outputs.should_run == 'true'
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          output_dir="$(mktemp -d "$RUNNER_TEMP/grimodex-c2zc-restore-fixture.XXXXXXXX")"
          printf 'output_dir=%s\n' "$output_dir" >> "$GITHUB_OUTPUT"
          expected_head="$(git rev-parse HEAD)"
          expected_tree="$(git rev-parse 'HEAD^{tree}')"
          cargo run -p grimodex-db \
            --manifest-path src-tauri/Cargo.toml \
            --features c2zc-fixture-builder \
            --bin c2zc-restore-fixture -- \
            build \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir "$output_dir" \
            --candidate HEAD \
            --expected-head "$expected_head" \
            --expected-tree "$expected_tree"
          cargo run -p grimodex-db \
            --manifest-path src-tauri/Cargo.toml \
            --features c2zc-fixture-builder \
            --bin c2zc-restore-fixture -- \
            verify \
            --manifest "$output_dir/c2zc-restore-fixture.manifest.json" \
            --repo-root "$GITHUB_WORKSPACE" \
            --candidate HEAD

      - name: Bind candidate-bound product journey evidence
        if: steps.product-journey-impact.outputs.should_run == 'true'
        env:
          GRIMODEX_C2ZC_RESTORE_FIXTURE_BUILD_DIR: ${{ steps.c2zc-restore-fixture.outputs.output_dir }}
        run: node scripts/prepare-electron-product-journey-evidence.mjs

      - name: Product journey gate
        if: steps.product-journey-impact.outputs.should_run == 'true'
        env:
          GRIMODEX_PRODUCT_JOURNEY_REQUIRE_ALL: "true"
          GRIMODEX_PRODUCT_JOURNEY_CATALOG_DIGEST: ${{ steps.product-journey-impact.outputs.catalog_digest }}
        run: |
          set -euo pipefail
          if [[ -n "${GRIMODEX_PRODUCT_JOURNEY_IDS:-}" ]]; then
            echo "Full product journey gate rejects GRIMODEX_PRODUCT_JOURNEY_IDS subset execution" >&2
            exit 1
          fi
          if [[ -n "${GRIMODEX_PRODUCT_JOURNEY_SET:-}" ]]; then
            echo "Full product journey gate rejects GRIMODEX_PRODUCT_JOURNEY_SET subset execution" >&2
            exit 1
          fi
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm electron:product-journeys

      - name: Upload product journey failure artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electron-product-journeys-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/product-journeys
          if-no-files-found: ignore
          retention-days: 14

  electron-windows-installer-contract:
    name: Electron Windows (unit test / NSIS migration contract)
    if: github.event_name != 'schedule' && !inputs.source_focused && !inputs.source_canonical_contracts && !inputs.canonical_profile && !inputs.candidate_base && !inputs.candidate_head && !inputs.max_parallel_tasks
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Electron tests on Windows
        run: pnpm test:electron --run

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
          key: ime-windows-atomic

      - name: Test repeated IME snapshot replacement on Windows
        run: >-
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          -p grimodex-db --lib windows_atomic_write

      - name: Test workspace restore maintenance barrier on Windows
        run: >-
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          -p grimodex-db --lib restore_waits_for_detached_workspace_maintenance_before_detaching_live_db

      - name: Test migration supervisor smoke on Windows
        run: >-
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          -p grimodex-db --test workspace_migration_supervisor

      - name: Test Safe Mode / restore-by-id smoke on Windows
        run: >-
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          -p grimodex-db --test workspace_safe_mode_outcome

      - name: Test release-schema migration fixture on Windows
        run: >-
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          -p grimodex-db --test release_schema_migration

      - name: Test same-path workspace reopen during maintenance on Windows
        run: >-
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          -p grimodex-db --lib same_path_reopen_does_not_retain_the_previous_active_database

      - name: Parse the migration E2E PowerShell script
        shell: pwsh
        run: |
          $Tokens = $null
          $ParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/verify-windows-tauri-migration.ps1),
            [ref]$Tokens,
            [ref]$ParseErrors
          ) | Out-Null
          if ($ParseErrors.Count -ne 0) {
            $ParseErrors | Format-List -Force
            exit 1
          }

      - name: Build Electron JavaScript
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm electron:build

      # This job validates electron-builder's two makensis passes, not the
      # platform runtime. Release-native binaries are built and exercised in
      # electron-native and again in the release matrix.
      - name: Prepare compile-only native placeholders
        shell: pwsh
        run: |
          New-Item -ItemType File -Path electron/native/grimodex-node/grimodex-node.node -Force | Out-Null
          New-Item -ItemType Directory -Path src-tauri/target/release -Force | Out-Null
          New-Item -ItemType File -Path src-tauri/target/release/grimodex-mcp.exe -Force | Out-Null

      - name: Compile the final NSIS installer with migration hooks
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm exec electron-builder --win nsis --x64 --publish never `
            --config.directories.output=release/electron-contract
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $Installer = @(Get-ChildItem release/electron-contract -Filter 'Grimodex-*-windows-x64.exe' -File)
          if ($Installer.Count -ne 1 -or $Installer[0].Length -eq 0) {
            Write-Error "Final NSIS migration-contract installer is missing."
            exit 1
          }

  electron-native:
    name: Electron native (N-API / release features / MCP)
    if: github.event_name != 'schedule' && !inputs.source_focused && !inputs.source_canonical_contracts && !inputs.canonical_profile && !inputs.candidate_base && !inputs.candidate_head && !inputs.max_parallel_tasks && !inputs.independent_gates
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Native build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libdbus-1-dev \
            libsecret-1-dev \
            pkg-config

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            src-tauri
            electron/native/grimodex-node
          key: electron-native

      - run: pnpm install --frozen-lockfile

      - name: Build and test the development N-API module
        run: |
          pnpm napi:build
          pnpm --dir electron/native/grimodex-node test

      - name: Check both release-only native features
        run: >-
          cargo check
          --manifest-path electron/native/grimodex-node/Cargo.toml
          --features licensing,legacy-keyring-migration

      - name: Clippy both release-only native features
        run: >-
          cargo clippy
          --manifest-path electron/native/grimodex-node/Cargo.toml
          --all-targets
          --features licensing,legacy-keyring-migration
          -- -D warnings

      - name: Test both release-only native features
        run: >-
          cargo test
          --manifest-path electron/native/grimodex-node/Cargo.toml
          --features licensing,legacy-keyring-migration

      - name: Test licensed MCP sidecar
        run: >-
          cargo test
          --manifest-path src-tauri/Cargo.toml
          -p grimodex-mcp
          --features licensing

  rust:
    name: Shared Rust crates (check / clippy / test)
    if: ${{ inputs.canonical_profile == 'shared-rust' || (github.event_name != 'schedule' && !inputs.source_focused && !inputs.source_canonical_contracts && !inputs.canonical_profile && !inputs.candidate_base && !inputs.candidate_head && !inputs.max_parallel_tasks && !inputs.independent_gates) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Validate standalone shared Rust selection
        if: inputs.canonical_profile
        env:
          PROFILE: ${{ inputs.canonical_profile }}
          PRODUCT_JOURNEY_MODE: ${{ inputs.product_journey_mode }}
          INDEPENDENT_GATES: ${{ inputs.independent_gates }}
          SOURCE_FOCUSED: ${{ inputs.source_focused }}
          SOURCE_RESOLVE_SHARP: ${{ inputs.source_resolve_sharp }}
          SOURCE_AUDIT_COMPAT: ${{ inputs.source_audit_compat }}
          SOURCE_CANONICAL_CONTRACTS: ${{ inputs.source_canonical_contracts }}
          CANDIDATE_BASE: ${{ inputs.candidate_base }}
          CANDIDATE_HEAD: ${{ inputs.candidate_head }}
          MAX_PARALLEL_TASKS: ${{ inputs.max_parallel_tasks }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$PROFILE" = shared-rust
          test "$PRODUCT_JOURNEY_MODE" = all
          for flag in "$INDEPENDENT_GATES" "$SOURCE_FOCUSED" "$SOURCE_RESOLVE_SHARP" "$SOURCE_AUDIT_COMPAT" "$SOURCE_CANONICAL_CONTRACTS"; do
            case "$flag" in false|"") ;; *) exit 1 ;; esac
          done
          test -z "$CANDIDATE_BASE$CANDIDATE_HEAD$MAX_PARALLEL_TASKS"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Native build dependencies
        run: |
          # GitHub Actions ランナー同梱の Microsoft apt リポジトリ(azure-cli / prod)が
          # 403 / "no longer signed" を返し apt-get update を中断させることがある。
          # 依存はすべて Ubuntu 標準アーカイブ由来で Microsoft リポジトリは不要なため、
          # update 前に該当ソースを除去する。
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libssl-dev
        env:
          DEBIAN_FRONTEND: noninteractive

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: cargo check
        working-directory: src-tauri
        run: >-
          cargo check --workspace --exclude grimodex
          --features grimodex-semantic/semantic-embedding

      - name: cargo clippy
        working-directory: src-tauri
        run: >-
          cargo clippy --workspace --exclude grimodex --all-targets
          --features grimodex-semantic/semantic-embedding
          -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: >-
          cargo test --workspace --exclude grimodex
          --features grimodex-semantic/semantic-embedding

      - name: cargo test (migration supervisor failpoints)
        working-directory: src-tauri
        run: >-
          cargo test
          -p grimodex-db
          --features test-failpoints
          --test workspace_migration_supervisor

      - name: cargo test (narrative runtime authority)
        working-directory: src-tauri
        run: >-
          cargo test
          -p grimodex-db
          --test narrative_runtime_authority

      # 通常buildではlicensingが無効なため、共有runtimeのnetwork/race testsは
      # workspace testだけだとcfgで0件になる。releaseと同じfeatureを明示する。
      - name: cargo test (license runtime with licensing feature)
        working-directory: src-tauri
        run: cargo test -p grimodex-license --features licensing

  nir1-c-query-worker:
    name: C-query worker (${{ matrix.os }})
    if: github.event_name != 'schedule' && !inputs.source_focused && !inputs.source_canonical_contracts && !inputs.canonical_profile && !inputs.candidate_base && !inputs.candidate_head && !inputs.max_parallel_tasks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Build private Q2/Q512 fixtures and run focused real-worker tests
        shell: bash
        run: bash scripts/nir1-c-query-worker-ci.sh

  migration-recovery-gate:
    name: Migration recovery gate (Gate A2)
    if: github.event_name != 'schedule' && !inputs.source_focused && !inputs.source_canonical_contracts && !inputs.canonical_profile && !inputs.candidate_base && !inputs.candidate_head && !inputs.max_parallel_tasks && !inputs.independent_gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Native build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libssl-dev
        env:
          DEBIAN_FRONTEND: noninteractive

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            src-tauri
            electron/native/grimodex-node
          key: migration-recovery-gate

      - run: pnpm install --frozen-lockfile

      - name: Migration supervisor unit/integration
        working-directory: src-tauri
        run: cargo test -p grimodex-db --test workspace_migration_supervisor

      - name: Migration supervisor failpoint suite
        working-directory: src-tauri
        run: >-
          cargo test
          -p grimodex-db
          --features test-failpoints
          --test workspace_migration_supervisor

      - name: Migration recovery failpoint library tests
        working-directory: src-tauri
        run: cargo test -p grimodex-db --features test-failpoints --lib

      - name: Safe Mode structured outcome + restore-by-id
        working-directory: src-tauri
        run: >-
          cargo test
          -p grimodex-db
          --features test-failpoints
          --test workspace_safe_mode_outcome

      - name: Real release-schema fixture + WAL preservation
        working-directory: src-tauri
        run: cargo test -p grimodex-db --test release_schema_migration

      - name: Subprocess crash recovery
        working-directory: src-tauri
        run: >-
          cargo test
          -p grimodex-db
          --features test-failpoints
          --test migration_subprocess_crash
          --test restore_subprocess_crash

      - name: Safe Mode IPC contract
        run: pnpm test:electron --run electron/shared/ipcContract.test.ts

      - name: Recovery Shell frontend tests
        run: >-
          pnpm test --run
          src/features/workspace/store.test.ts
          src/features/workspace/recovery/RecoveryShell.test.tsx
