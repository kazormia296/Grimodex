name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (type-check / lint / test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: テスト
        run: pnpm test:node --run

  browser:
    name: Browser (Vitest browser + Storybook)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Chromium バイナリキャッシュ
        id: pw-cache
        uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-chromium

      - name: Playwright Chromium + システム依存をインストール
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: システム依存のみインストール (キャッシュヒット時)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: ブラウザテスト
        run: pnpm test:browser --run

      - name: Storybook テスト
        run: pnpm test:storybook --run

  security:
    name: Security (audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level critical

  rust:
    name: Rust (check / clippy / test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ランナーのディスク容量を確保
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/dotnet /usr/share/swift
          df -h /

      - name: システム依存ライブラリのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
        env:
          DEBIAN_FRONTEND: noninteractive

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: lindera-unidic バージョン解決
        id: lindera-ver
        run: |
          ver=$(grep -A1 '^name = "lindera-unidic"$' src-tauri/Cargo.lock \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          if [ -z "$ver" ]; then
            echo "::error::lindera-unidic version not found in src-tauri/Cargo.lock"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: UniDic 辞書キャッシュ復元
        id: lindera-dict
        uses: actions/cache/restore@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4
        with:
          path: lindera-cache
          key: lindera-unidic-${{ steps.lindera-ver.outputs.version }}-unidic-mecab-2.1.2

      - name: UniDic 辞書を取得 (キャッシュミス時)
        if: steps.lindera-dict.outputs.cache-hit != 'true'
        run: |
          dir="lindera-cache/${{ steps.lindera-ver.outputs.version }}"
          mkdir -p "$dir"
          curl -fSL --retry 5 --retry-all-errors \
            -o "$dir/unidic-mecab-2.1.2.tar.gz" \
            https://Lindera.dev/unidic-mecab-2.1.2.tar.gz
          echo "f4502a563e1da44747f61dcd2b269e35  $dir/unidic-mecab-2.1.2.tar.gz" \
            | md5sum -c -

      - name: UniDic 辞書キャッシュ保存
        if: steps.lindera-dict.outputs.cache-hit != 'true'
        uses: actions/cache/save@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4
        with:
          path: lindera-cache
          key: lindera-unidic-${{ steps.lindera-ver.outputs.version }}-unidic-mecab-2.1.2

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --workspace

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --workspace
