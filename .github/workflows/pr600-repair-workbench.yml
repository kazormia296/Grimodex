name: PR600 repair workbench (temporary)
on:
  push:
    branches: [codex/pr600-review-repair-workbench]
    paths: ['.github/pr600-repair/**', '.github/workflows/pr600-repair-workbench.yml']
permissions:
  contents: read
concurrency:
  group: pr600-review-repair-workbench
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: b56ab8034b9bbab3475b23e9957b0a1f42a86a5f
          path: work
          persist-credentials: false
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: work/src-tauri
          key: pr600-repair-db
          cache-on-failure: true
      - name: Apply lane A in isolated checkout
        working-directory: work
        run: python3 ../runner/.github/pr600-repair/lane_a.py
      - name: Focused DB regressions
        working-directory: work
        shell: bash
        run: |
          mkdir -p ../evidence
          set +e
          cargo test --locked --manifest-path src-tauri/Cargo.toml -p grimodex-db --lib pr600_ -- --test-threads=1 > ../evidence/db-regressions.log 2>&1
          status=$?
          tail -n 140 ../evidence/db-regressions.log
          exit "$status"
      - name: Existing connection lifecycle tests
        working-directory: work
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p grimodex-db --lib narrative_maintenance_connection -- --test-threads=1
      - name: Changed file summary
        if: always()
        working-directory: work
        run: git diff --stat
