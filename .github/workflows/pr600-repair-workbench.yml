name: PR600 repair workbench (temporary)
on:
  push:
    branches: [codex/pr600-review-repair-workbench]
    paths: ['.github/pr600-repair/**', '.github/workflows/pr600-repair-workbench.yml']
permissions:
  contents: read
concurrency:
  group: pr600-review-repair-workbench
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: b56ab8034b9bbab3475b23e9957b0a1f42a86a5f
          path: work
          persist-credentials: false
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: |
            work/src-tauri
            work/electron/native/grimodex-node
          key: pr600-repair-db
          cache-on-failure: true
      - name: Apply owned repair lanes
        id: apply
        working-directory: work
        run: python3 ../runner/.github/pr600-repair/prepare.py > /tmp/pr600-apply.log
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.0
      - name: Install JS dependencies
        id: install
        working-directory: work
        run: pnpm install --frozen-lockfile
      - name: Electron typecheck and focused regressions
        id: js
        working-directory: work
        run: |
          set +e
          pnpm exec tsc -p electron/tsconfig.json --noEmit > /tmp/pr600-types.log 2>&1
          types=$?
          tail -n 80 /tmp/pr600-types.log
          pnpm test:electron --run electron/main/narrativeMaintenance.ownership.test.ts electron/main/narrativeMaintenance.review-fixes.test.ts electron/main/narrativeMaintenanceShutdown.test.ts electron/main/narrativeMaintenance.test.ts > /tmp/pr600-js.log 2>&1
          tests=$?
          tail -n 100 /tmp/pr600-js.log
          node --test scripts/nir1-material-capacity-probe.review-fixes.test.mjs
          peak=$?
          test "$types:$tests:$peak" = '0:0:0'
      - name: Focused DB regressions
        if: always() && steps.apply.outcome == 'success'
        id: db
        working-directory: work
        shell: bash
        run: |
          set +e
          cargo test --locked --manifest-path src-tauri/Cargo.toml -p grimodex-db --lib pr600_ -- --test-threads=1 > /tmp/pr600-db.log 2>&1
          status=$?
          tail -n 120 /tmp/pr600-db.log
          exit "$status"
      - name: NAPI compile check
        if: always() && steps.apply.outcome == 'success'
        id: native
        working-directory: work
        shell: bash
        run: |
          set +e
          cargo check --locked --manifest-path electron/native/grimodex-node/Cargo.toml > /tmp/pr600-native.log 2>&1
          status=$?
          tail -n 140 /tmp/pr600-native.log
          exit "$status"
      - name: Changed file summary
        if: always()
        working-directory: work
        run: |
          tail -n 4 /tmp/pr600-apply.log
          git diff --stat
