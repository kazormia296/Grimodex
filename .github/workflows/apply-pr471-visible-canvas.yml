name: Apply PR471 visible canvas fix

on:
  push:
    branches:
      - agent/zen-gpu-glass-pipeline-final

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-pr471-visible-canvas]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zen-gpu-glass-pipeline-final
          fetch-depth: 0

      - name: Keep the custom multipass canvas above Paper's fallback layer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1))

          canvas = Path("src/features/editor/zen/ZenMultipassCanvas.tsx")
          replace_once(
              canvas,
              '''      className={className}
                    style={style}
                    aria-hidden="true"
                  >
                    <canvas ref={canvasRef} className="absolute inset-0 h-full w-full" />
          ''',
              '''      className={className}
                    style={{
                      // Paper Shaders installs a global [data-paper-shader] rule whose
                      // wrapper is relative and whose canvas is z-index: -1. This is a
                      // custom renderer, so own its complete stacking contract inline.
                      position: "absolute",
                      inset: 0,
                      isolation: "isolate",
                      overflow: "hidden",
                      ...style,
                    }}
                    aria-hidden="true"
                  >
                    <canvas
                      ref={canvasRef}
                      className="absolute inset-0 h-full w-full"
                      style={{
                        contain: "strict",
                        display: "block",
                        position: "absolute",
                        inset: 0,
                        zIndex: 0,
                        width: "100%",
                        height: "100%",
                      }}
                    />
          ''',
          )

          surface = Path("src/features/editor/zen/ZenShaderSurface.tsx")
          replace_once(
              surface,
              '''  webGlSupported?: boolean;
                onRendererStatusChange?: (status: ZenShaderRendererStatus) => void;
          ''',
              '''  webGlSupported?: boolean;
                webGlContextAttributes?: WebGLContextAttributes;
                onRendererStatusChange?: (status: ZenShaderRendererStatus) => void;
          ''',
          )
          replace_once(
              surface,
              '''  webGlSupported = true,
                onRendererStatusChange,
          ''',
              '''  webGlSupported = true,
                webGlContextAttributes = LIVE_WEBGL_CONTEXT_ATTRIBUTES,
                onRendererStatusChange,
          ''',
          )
          replace_once(
              surface,
              '''            webGlContextAttributes={LIVE_WEBGL_CONTEXT_ATTRIBUTES}
          ''',
              '''            webGlContextAttributes={webGlContextAttributes}
          ''',
          )

          browser_test = Path("src/features/editor/zen/ZenShaderSurface.browser.test.tsx")
          text = browser_test.read_text()
          marker = '''const shaderLayouts = vi.hoisted(() => ({
          '''
          if text.count(marker) != 1:
              raise SystemExit("ZenShaderSurface browser test insertion marker drifted")
          attributes = '''const TEST_WEBGL_CONTEXT_ATTRIBUTES = {
            alpha: true,
            antialias: false,
            powerPreference: "default",
            premultipliedAlpha: true,
            // Tests read the default framebuffer after React has yielded. Production
            // keeps this false; the test override makes that readback deterministic.
            preserveDrawingBuffer: true,
          } satisfies WebGLContextAttributes;

          '''
          text = text.replace(marker, attributes + marker, 1)
          prop_marker = '''          webGlSupported
                    onRendererStatusChange={onRendererStatusChange}
          '''
          prop_count = text.count(prop_marker)
          if prop_count != 4:
              raise SystemExit(f"expected four WebGL surface renders, got {prop_count}")
          text = text.replace(
              prop_marker,
              '''          webGlSupported
                    webGlContextAttributes={TEST_WEBGL_CONTEXT_ATTRIBUTES}
                    onRendererStatusChange={onRendererStatusChange}
          ''',
          )
          ready_marker = '''    const firstAnimatedDrawCount = drawCount(view.container);
                const firstAnimatedFrame = readFrame(view.container);
          '''
          if text.count(ready_marker) != 1:
              raise SystemExit("animated integration assertion marker drifted")
          text = text.replace(
              ready_marker,
              '''    const visibleCanvas = view.container.querySelector("canvas");
                expect(visibleCanvas).toBeInstanceOf(HTMLCanvasElement);
                expect(getComputedStyle(visibleCanvas!).position).toBe("absolute");
                expect(getComputedStyle(visibleCanvas!).zIndex).toBe("0");

                const firstAnimatedDrawCount = drawCount(view.container);
                const firstAnimatedFrame = readFrame(view.container);
          ''',
              1,
          )
          browser_test.write_text(text)

          chronicle = Path("src/features/chronicle/ChronicleViewport.browser.test.tsx")
          replace_once(
              chronicle,
              '''  it("Glass 時は Chronicle 構造面を透過し、track 境界で marker を clip する", async () => {
          ''',
              '''  it("WebGL Glass 時は CSS blur を重ねず Chronicle 構造面を透過し、track 境界で marker を clip する", async () => {
          ''',
          )
          replace_once(
              chronicle,
              '''    expect(getComputedStyle(host).backdropFilter).toContain("blur(14px)");
          ''',
              '''    // WebGL-ready時はGPUの最終パスがGlass blurを所有するため、
                // CSS backdrop-filterを重ねてはいけない。
                expect(getComputedStyle(host).backdropFilter).toBe("none");
          ''',
          )
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-pr471-visible-canvas.yml
          git add -A
          git commit -m "fix(editor): keep the multipass canvas visible"
          git push origin HEAD:agent/zen-gpu-glass-pipeline-final
