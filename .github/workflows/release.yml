name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "ドラフトリリースとして作成する"
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.platform }})
    needs: ci
    permissions:
      contents: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # ort の prebuilt ONNX Runtime は glibc 2.38+ でビルドされており
          # __isoc23_strtol 等を参照する。ubuntu-22.04 (glibc 2.35) では
          # rust-lld が undefined symbol で落ちるため 24.04 以上必須。
          - platform: ubuntu-24.04
          - platform: macos-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Linux 依存ライブラリのインストール
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          # GitHub Actions ランナー同梱の Microsoft apt リポジトリ(azure-cli / prod)が
          # 403 / "no longer signed" を返し apt-get update を中断させることがある。
          # 依存はすべて Ubuntu 標準アーカイブ由来で Microsoft リポジトリは不要なため、
          # update 前に該当ソースを除去する。
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config \
            build-essential \
            libdbus-1-dev \
            libsecret-1-dev
        env:
          DEBIAN_FRONTEND: noninteractive

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - run: pnpm install --frozen-lockfile

      # ライセンス機構 (ライセンス認証設計書 §9.1): v1.0.0 以降のリリースのみ
      # `licensing` feature を有効化。バージョン由来の自動判定なので入力ミスが
      # 入らない (ベータ v0.x は常に無効)。Settings > About でも目視確認可。
      - name: licensing feature の判定 (v1.0.0 以降のみ有効)
        id: licensing
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          MAJOR="${VERSION%%.*}"
          if [ "$MAJOR" -ge 1 ]; then
            echo "args=--features licensing" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      # updater 署名の公開鍵がプレースホルダのままだと、配信後に全更新の署名
      # 検証が必ず失敗する (実機で気づけない)。v1.0.0 以降のビルドで差し替え忘れを
      # ここで落とす。
      - name: updater pubkey が本番用に差し替え済みか検証 (v1.0.0 以降)
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          MAJOR="${VERSION%%.*}"
          PUBKEY=$(node -p "require('./src-tauri/tauri.conf.json').plugins?.updater?.pubkey || ''")
          if [ "$MAJOR" -ge 1 ] && { [ -z "$PUBKEY" ] || [ "$PUBKEY" = "__REPLACE_WITH_UPDATER_PUBKEY__" ]; }; then
            echo "::error::updater pubkey がプレースホルダのままです。pnpm tauri signer generate で生成した公開鍵に差し替えてください。" >&2
            exit 1
          fi

      # ── macOS コード署名 (Apple Developer 承認済) ────────────────────────────
      # Developer ID Application 証明書を一時キーチェーンへインポートし、署名 ID を
      # 後続 step 用に CERT_ID として公開する。macOS ランナーのみ。Tauri 公式の
      # GitHub Actions 例と同じ「手動 import → CERT_ID を APPLE_SIGNING_IDENTITY へ」方式。
      - name: Apple 証明書のインポート (macOS のみ)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # 一時キーチェーンを既存の user 検索リストへ追加（codesign が鍵を見つけられるように）。
          # bare 名でなくフルパスで既存キーチェーンも保持する。
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed s/\"//g)
          # awk 単一パスで抽出（grep|head の非ゼロ終了で set -e が誤発火するのを回避）。
          CERT_ID=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$CERT_ID" ]; then
            echo "::error::Developer ID Application 証明書がキーチェーンに見つかりません。APPLE_CERTIFICATE を確認してください。" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" >&2 || true
            exit 1
          fi
          echo "CERT_ID=$CERT_ID" >> "$GITHUB_ENV"
          echo "signing identity: $CERT_ID"
          rm -f "$CERT_PATH"

      # App Store Connect API キー (.p8) をランナー上のファイルへ復元。
      # tauri-action / Tauri CLI は APPLE_API_KEY_PATH に .p8 の「ファイルパス」を要求する。
      - name: App Store Connect API キーの配置 (macOS のみ)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/authkey.p8"

      - name: Tauri ビルド & リリース作成
        id: build
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS コード署名 + notarization（App Store Connect API キー方式）。
          # 非 macOS ランナーでは env が空になるだけで無害。CERT_ID は上の import step が設定。
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/authkey.p8
          # Windows / アップデーター署名（updater/NSIS 署名鍵。GitHub Secrets に登録）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          # updater overlay (createUpdaterArtifacts) を release ビルドのみ合成。
          args: ${{ steps.licensing.outputs.args }} --config src-tauri/tauri.updater.conf.json
          includeUpdaterJson: true
          tagName: v__VERSION__
          releaseName: "Grimodex v__VERSION__"
          releaseBody: |
            Grimodex v__VERSION__ をリリースしました。

            ## インストール方法
            下記 Assets から各プラットフォームのインストーラーをダウンロードしてください。

            | OS | ファイル |
            |----|---------|
            | Linux (Debian/Ubuntu) | `.deb` |
            | Linux (Universal) | `.AppImage` |
            | macOS | `.dmg` |
            | Windows | `.exe` |

            ---
            <!-- リリースノートをここに追記してください -->
          # タグ push 時は常に Draft。手動実行時は inputs.draft（デフォルト true）で制御
          releaseDraft: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
          prerelease: ${{ contains(github.ref_name, '-') }}

      # tauri/#7533: Tauri は .app を署名+notarize+staple するが .dmg はしない。
      # 配布物である DMG を明示的に notarize + staple し、tauri-action が draft release へ
      # アップ済みの未 staple DMG を staple 版で差し替える。未対応だと DL 後の DMG 初回
      # マウントで Gatekeeper 警告（「開発元を確認できません」）が出る。release ID 経由で
      # 差し替えるので draft（未公開タグ）でも成立する。
      - name: DMG を notarize + staple して差し替え (macOS のみ)
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          RELEASE_ID: ${{ steps.build.outputs.releaseId }}
          RELEASE_UPLOAD_URL: ${{ steps.build.outputs.releaseUploadUrl }}
        run: |
          set -euo pipefail
          DMG=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" -print -quit)
          if [ -z "$DMG" ]; then
            echo "::error::DMG が bundle/dmg に見つかりません。" >&2
            exit 1
          fi
          echo "notarizing DMG: $DMG"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/authkey.p8" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          # 未 staple の同名アセットを削除 → staple 版をアップロード（release ID 経由）
          ASSET_NAME=$(basename "$DMG")
          OLD_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
            --jq ".[] | select(.name==\"${ASSET_NAME}\") | .id" | head -n1 || true)
          if [ -n "${OLD_ID:-}" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${OLD_ID}"
          fi
          UPLOAD_BASE="${RELEASE_UPLOAD_URL%%\{*}"
          curl -sSf -X POST "${UPLOAD_BASE}?name=${ASSET_NAME}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$DMG"
          echo "DMG replaced with notarized + stapled version: $ASSET_NAME"

      # 署名・公証・staple を CI 内で静的検証（実機 Mac 不要）。いずれか失敗でビルドを落とす。
      # ここが緑なら「署名済み・hardened runtime・secure timestamp・公証チケット staple 済み・
      # Gatekeeper が accept」までが機械的に保証される（対話的な初回起動 UI と updater 実機
      # 挙動だけは CI では検証不可 → クラウド Mac で1回確認）。
      - name: 署名・公証・staple を検証 (macOS のみ)
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app" -print -quit)
          DMG=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" -print -quit)
          if [ -z "$APP" ] || [ -z "$DMG" ]; then
            echo "::error::.app または .dmg が見つかりません。" >&2
            exit 1
          fi
          echo "== codesign --verify (app) =="
          codesign --verify --deep --strict --verbose=4 "$APP"
          echo "== Developer ID + hardened runtime + secure timestamp =="
          codesign -dvvv "$APP" 2>&1 | grep -E 'Authority=Developer ID Application'
          codesign -dvvv "$APP" 2>&1 | grep -E 'flags=.*runtime'
          codesign -dvvv "$APP" 2>&1 | grep -E 'Timestamp='
          echo "== spctl assess (app / exec) =="
          spctl -a -vvv -t exec --ignore-cache "$APP"
          echo "== stapler validate (app + dmg) =="
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"
          echo "== spctl assess (dmg container) =="
          spctl -a -vvv -t open --context context:primary-signature --ignore-cache "$DMG"
          # quarantine bit を付けた経路も確認（runner の Gatekeeper 状態依存なので warning 止まり）
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;$(uuidgen)" "$DMG" || true
          spctl -a -vvv -t open --context context:primary-signature "$DMG" \
            || echo "::warning::quarantine 付き spctl が accept しませんでした（runner 状態依存の可能性。要実機確認）。"
          echo "✅ 署名・公証・staple すべて検証 OK"
