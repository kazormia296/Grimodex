name: Electron v2 Release
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
      format('Release debug {0} at {1}', inputs.target, inputs.candidate_ref) ||
      format('Electron v2 Release {0}', github.ref_name) }}

on:
  push:
    tags:
      - "v2.*"
  workflow_dispatch:
    inputs:
      target:
        description: Release stage to verify without publishing
        required: true
        default: windows
        type: choice
        options:
          - windows
          - mac
          - linux
          - publish
          - all
      publish:
        description: Must remain false; manual debug runs never publish
        required: true
        default: false
        type: boolean
      recover_draft:
        description: Recover one Draft Release from a failed immutable tag run
        required: true
        default: false
        type: boolean
      candidate_ref:
        description: Default branch or full 40-character SHA; workflow always runs from master
        required: true
        default: master
        type: string
      source_run_id:
        description: Completed tag run whose artifacts are reused by target=publish
        required: false
        default: ""
        type: string

concurrency:
  group: >-
    ${{ (github.event_name == 'push' ||
         (github.event_name == 'workflow_dispatch' &&
          inputs.target == 'publish' &&
          inputs.recover_draft == true)) &&
        'release-electron-v2-mutation' ||
        format('release-electron-v2-debug-{0}-{1}', inputs.target, inputs.candidate_ref) }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  ci:
    name: CI Checks
    needs: [release-gate, bridge-signing-preflight]
    if: >-
      always() &&
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      needs.release-gate.result == 'success' &&
      needs.release-gate.outputs.should_publish == 'true' &&
      ((needs.release-gate.outputs.prerelease == 'true' &&
        needs.bridge-signing-preflight.result == 'skipped') ||
       (needs.release-gate.outputs.prerelease == 'false' &&
        needs.bridge-signing-preflight.result == 'success'))
    uses: ./.github/workflows/ci.yml
    with:
      product_journey_mode: all

  release-gate:
    name: Resolve v2 release or debug identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.version.outputs.mode }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      target: ${{ steps.version.outputs.target }}
      run_build: ${{ steps.version.outputs.run_build }}
      should_publish: ${{ steps.version.outputs.should_publish }}
      recover_draft: ${{ steps.version.outputs.recover_draft }}
      source_run_id: ${{ steps.version.outputs.source_run_id }}
      candidate_ref: ${{ steps.version.outputs.candidate_ref }}
      candidate_sha: ${{ steps.version.outputs.candidate_sha }}
      checkout_ref: ${{ steps.version.outputs.checkout_ref }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - name: Checkout trusted workflow source
        id: workflow-source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
          path: workflow-source

      - name: Resolve the debug candidate to an immutable commit
        id: candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Release/debug identity hard gate
        id: version
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TARGET: ${{ inputs.target }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          RECOVER_DRAFT: ${{ inputs.recover_draft }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.commit || steps.workflow-source.outputs.commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          PACKAGE_PATH="workflow-source/package.json"
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            PACKAGE_PATH="candidate/package.json"
          fi
          node workflow-source/scripts/resolve-release-workflow.mjs \
            --event "$RELEASE_EVENT" \
            --ref-name "$RELEASE_REF_NAME" \
            --ref-type "$RELEASE_REF_TYPE" \
            --default-branch "$DEFAULT_BRANCH" \
            --candidate-ref "$CANDIDATE_REF" \
            --candidate-sha "$CANDIDATE_SHA" \
            --target "$RELEASE_TARGET" \
            --publish "$RELEASE_PUBLISH" \
            --recover-draft "$RECOVER_DRAFT" \
            --source-run-id "$SOURCE_RUN_ID" \
            --base-package workflow-source/package.json \
            --package "$PACKAGE_PATH" \
            --major 2

  release-state:
    name: Detect completed immutable bridge release
    needs: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      complete: ${{ steps.state.outputs.complete }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-gate.outputs.checkout_ref }}

      - name: Verify an existing completion marker
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-gate.outputs.tag }}
          VERSION: ${{ needs.release-gate.outputs.version }}
          PRERELEASE: ${{ needs.release-gate.outputs.prerelease }}
        run: |
          set -euo pipefail
          echo "complete=false" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$PRERELEASE" != "false" ]; then
            exit 0
          fi
          RELEASES_JSON="$RUNNER_TEMP/releases.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RELEASES_JSON"
          RELEASE_MATCH_COUNT=$(jq --arg tag "$TAG" \
            '[.[][] | select(.tag_name == $tag)] | length' "$RELEASES_JSON")
          if [ "$RELEASE_MATCH_COUNT" -gt 1 ]; then
            echo "::error::Multiple GitHub releases use tag ${TAG}." >&2
            exit 1
          fi
          if [ "$RELEASE_MATCH_COUNT" -eq 0 ]; then
            exit 0
          fi
          EXISTING_DIR="$RUNNER_TEMP/existing-release"
          mkdir -p "$EXISTING_DIR"
          LATEST_ASSET_COUNT=$(jq --arg tag "$TAG" \
            '[.[][] | select(.tag_name == $tag) | .assets[]? | select(.name == "latest.json")] | length' \
            "$RELEASES_JSON")
          if [ "$LATEST_ASSET_COUNT" -gt 1 ]; then
            echo "::error::Release ${TAG} has multiple latest.json assets." >&2
            exit 1
          fi
          if [ "$LATEST_ASSET_COUNT" -eq 0 ]; then
            exit 0
          fi
          LATEST_ASSET_ID=$(jq -r --arg tag "$TAG" \
            '.[][] | select(.tag_name == $tag) | .assets[]? | select(.name == "latest.json") | .id' \
            "$RELEASES_JSON")
          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${LATEST_ASSET_ID}" \
            > "$EXISTING_DIR/latest.json"
          node --input-type=module -e \
            "import fs from 'node:fs'; import {validateBridgeManifestSchema} from './scripts/generate-tauri-bridge-manifest.mjs'; const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); validateBridgeManifestSchema(m); if(m.version!==process.env.VERSION) throw new Error('Existing bridge version mismatch');" \
            "$EXISTING_DIR/latest.json"
          RELEASE_JSON="$EXISTING_DIR/release.json"
          EXPECTED_NOTES="$EXISTING_DIR/expected-release-notes.md"
          jq --arg tag "$TAG" \
            '.[][] | select(.tag_name == $tag)' "$RELEASES_JSON" > "$RELEASE_JSON"
          node scripts/compose-github-release-notes.mjs \
            --tag "$TAG" \
            --ja "public/RELEASE_NOTES/v${VERSION}.ja.md" \
            --en "public/RELEASE_NOTES/v${VERSION}.en.md" \
            --output "$EXPECTED_NOTES"
          node --input-type=module -e \
            "import fs from 'node:fs'; const release=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); const expectedBody=fs.readFileSync(process.argv[2],'utf8'); const expectedPrerelease=process.env.PRERELEASE==='true'; if(release.tag_name!==process.env.TAG) throw new Error('Completed Draft tag mismatch'); if(release.draft!==true) throw new Error('Completed release must remain a Draft'); if(release.prerelease!==expectedPrerelease) throw new Error('Completed Draft prerelease state mismatch'); if(release.body!==expectedBody) throw new Error('Completed Draft body does not match authored release notes'); if(!Number.isSafeInteger(release.id) || release.id <= 0) throw new Error('Completed Draft release ID is invalid'); console.log('Completed Draft Release verified:', release.html_url);" \
            "$RELEASE_JSON" "$EXPECTED_NOTES"
          echo "complete=true" >> "$GITHUB_OUTPUT"

  bridge-signing-preflight:
    name: Preflight stable bridge signing
    needs: [release-gate, release-state]
    if: >-
      always() &&
      !cancelled() &&
      needs.release-gate.result == 'success' &&
      needs.release-state.result == 'success' &&
      needs.release-state.outputs.complete != 'true' &&
      needs.release-gate.outputs.prerelease == 'false' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref_name == github.event.repository.default_branch &&
        inputs.publish == false &&
        inputs.candidate_ref == github.event.repository.default_branch &&
        (inputs.target == 'publish' || inputs.target == 'all'))) &&
      (needs.release-gate.outputs.should_publish == 'true' ||
       needs.release-gate.outputs.target == 'publish' ||
       needs.release-gate.outputs.target == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-gate.outputs.checkout_ref }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify the frozen bridge key with a signed probe
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for stable bridge latest.json." >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          PUBKEY_FILE="packaging/tauri-v1/updater-public-key.pub"
          EMBEDDED_PUBKEY_FILE="$RUNNER_TEMP/tauri-updater-embedded.pub"
          PROBE_FILE="$RUNNER_TEMP/tauri-bridge-signing-probe.txt"
          DECODED_SIGNATURE="$RUNNER_TEMP/tauri-bridge-signing-probe.minisig"
          node -e "const c=require('./src-tauri/tauri.conf.json');process.stdout.write(Buffer.from(c.plugins.updater.pubkey,'base64'))" \
            > "$EMBEDDED_PUBKEY_FILE"
          test -s "$PUBKEY_FILE"
          if ! cmp -s "$PUBKEY_FILE" "$EMBEDDED_PUBKEY_FILE"; then
            echo "::error::Current Tauri updater public key differs from the frozen bridge key." >&2
            exit 1
          fi
          printf 'Grimodex stable bridge signing preflight\n' > "$PROBE_FILE"
          pnpm tauri signer sign "$PROBE_FILE"
          test -s "${PROBE_FILE}.sig"
          base64 --decode "${PROBE_FILE}.sig" > "$DECODED_SIGNATURE"
          minisign -Vm "$PROBE_FILE" -x "$DECODED_SIGNATURE" -p "$PUBKEY_FILE"

  build:
    name: Build Electron (${{ matrix.id }})
    needs: [release-gate, ci, bridge-signing-preflight]
    if: >-
      always() &&
      !cancelled() &&
      needs.release-gate.result == 'success' &&
      needs.release-gate.outputs.run_build == 'true' &&
      (needs.ci.result == 'success' ||
       (needs.release-gate.outputs.should_publish != 'true' &&
        needs.ci.result == 'skipped')) &&
      (needs.bridge-signing-preflight.result == 'success' ||
       (needs.bridge-signing-preflight.result == 'skipped' &&
        (needs.release-gate.outputs.prerelease == 'true' ||
         (needs.release-gate.outputs.should_publish != 'true' &&
          needs.release-gate.outputs.target != 'all' &&
          needs.release-gate.outputs.target != 'publish'))))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-gate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-gate.outputs.checkout_ref }}

      - name: Linux build dependencies
        if: matrix.id == 'linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libdbus-1-dev \
            libsecret-1-dev \
            pkg-config \
            rpm

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            src-tauri
            electron/native/grimodex-node
          key: electron-v2-${{ matrix.id }}

      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.29
          enable-cache: true
          cache-dependency-glob: experiments/lfm25-encoder-phase0/uv.lock

      - name: Bootstrap pinned Semantic Recall rerankers
        working-directory: experiments/lfm25-encoder-phase0
        run: >-
          uv run --frozen --no-dev python tools/bootstrap_rerankers.py
          --config configs/phase0b-rerankers.yaml
          --model ja_xsmall
          --model en_minilm_l4

      - name: Import Apple Developer ID certificate
        if: >-
          matrix.id == 'mac' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' &&
            github.ref_name == github.event.repository.default_branch &&
            inputs.candidate_ref == github.event.repository.default_branch &&
            (inputs.target == 'mac' || inputs.target == 'all')))
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed s/\"//g)
          CERT_ID=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$CERT_ID" ]; then
            echo "::error::Developer ID Application certificate was not found." >&2
            exit 1
          fi
          CERT_NAME="${CERT_ID#Developer ID Application: }"
          if [ -z "$CERT_NAME" ] || [ "$CERT_NAME" = "$CERT_ID" ]; then
            echo "::error::Unexpected Developer ID identity format: $CERT_ID" >&2
            exit 1
          fi
          echo "CSC_NAME=$CERT_NAME" >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"

      - name: Restore App Store Connect API key
        if: >-
          matrix.id == 'mac' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' &&
            github.ref_name == github.event.repository.default_branch &&
            inputs.candidate_ref == github.event.repository.default_branch &&
            (inputs.target == 'mac' || inputs.target == 'all')))
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/authkey.p8"

      - name: Build licensed native runtime and MCP sidecar
        run: pnpm electron:native:release

      - name: Electron unit tests
        run: pnpm test:electron --run

      - name: Build Electron main, preload, and renderer
        run: pnpm electron:build

      # Windows artifacts are intentionally distributed unsigned. Disable
      # electron-builder certificate discovery so hosted-runner state cannot
      # silently change that release contract.
      - name: Configure unsigned Windows packages
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          "CSC_IDENTITY_AUTO_DISCOVERY=false" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build non-macOS host packages without publishing
        if: matrix.id != 'mac'
        run: pnpm exec electron-builder --publish never

      - name: Build signed macOS packages without publishing
        if: >-
          matrix.id == 'mac' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' &&
            github.ref_name == github.event.repository.default_branch &&
            inputs.candidate_ref == github.event.repository.default_branch &&
            (inputs.target == 'mac' || inputs.target == 'all')))
        env:
          CSC_NAME: ${{ env.CSC_NAME }}
          APPLE_API_KEY: ${{ runner.temp }}/authkey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm exec electron-builder --publish never

      - name: Verify Linux native ABI and deb dependency floor
        if: matrix.id == 'linux'
        run: |
          set -euo pipefail
          NODE_BINARY=electron/native/grimodex-node/grimodex-node.node
          MAX_GLIBC=$(objdump -T "$NODE_BINARY" \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' \
            | sed 's/^GLIBC_//' | sort -Vu | tail -n1)
          if [ -z "$MAX_GLIBC" ]; then
            echo "::error::No GLIBC symbol versions found in $NODE_BINARY" >&2
            exit 1
          fi
          if ! dpkg --compare-versions "$MAX_GLIBC" le 2.39; then
            echo "::error::.node requires GLIBC_${MAX_GLIBC}, above the declared 2.39 floor." >&2
            exit 1
          fi

          shopt -s nullglob
          DEBS=(release/electron/*.deb)
          if [ "${#DEBS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one deb, found ${#DEBS[@]}." >&2
            exit 1
          fi
          DEPENDS=$(dpkg-deb -f "${DEBS[0]}" Depends)
          for required in \
            'libc6 (>= 2.39)' \
            'libstdc++6 (>= 12)' \
            'libgcc-s1' \
            'libdbus-1-3'; do
            if ! grep -Fq "$required" <<<"$DEPENDS"; then
              echo "::error::deb dependency floor is missing: $required" >&2
              echo "Depends: $DEPENDS" >&2
              exit 1
            fi
          done

          RPMS=(release/electron/*.rpm)
          if [ "${#RPMS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one rpm, found ${#RPMS[@]}." >&2
            exit 1
          fi
          RPM_DEPENDS=$(rpm -qpR "${RPMS[0]}")
          for required in \
            'glibc >= 2.39' \
            'libstdc++' \
            'libgcc' \
            'dbus-libs' \
            'libsecret'; do
            if ! grep -Fq "$required" <<<"$RPM_DEPENDS"; then
              echo "::error::rpm dependency floor is missing: $required" >&2
              echo "Requires: $RPM_DEPENDS" >&2
              exit 1
            fi
          done

          RPM_SCRIPTS=$(rpm -qp --scripts "${RPMS[0]}")
          for required in \
            'posttrans scriptlet' \
            'rpm -q "${package_name}"' \
            'update-alternatives --install' \
            'chrome-sandbox' \
            'apparmor-profile'; do
            if ! grep -Fq "$required" <<<"$RPM_SCRIPTS"; then
              echo "::error::rpm posttrans migration repair is missing: $required" >&2
              echo "$RPM_SCRIPTS" >&2
              exit 1
            fi
          done

      - name: Verify unsigned Windows artifacts
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          $App = Get-ChildItem -Path release/electron/win-unpacked -Filter *.exe -File | Select-Object -First 1
          $Installer = Get-ChildItem -Path release/electron -Filter *.exe -File | Select-Object -First 1
          if ($null -eq $App -or $null -eq $Installer) {
            Write-Error "Windows app executable or NSIS installer is missing."
            exit 1
          }
          foreach ($File in @($App, $Installer)) {
            $Signature = Get-AuthenticodeSignature -FilePath $File.FullName
            if ($Signature.Status.ToString() -ne "NotSigned") {
              Write-Error "Expected an unsigned Windows artifact, got $($Signature.Status): $($File.FullName)"
              exit 1
            }
          }

      - name: Verify Tauri v0.10.4 to Electron migration
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          $Installer = @(Get-ChildItem -Path release/electron -Filter 'Grimodex-*-windows-x64.exe' -File)
          if ($Installer.Count -ne 1) {
            Write-Error "Expected exactly one Electron NSIS installer, found $($Installer.Count)."
            exit 1
          }
          & ./scripts/verify-windows-tauri-migration.ps1 -InstallerPath $Installer[0].FullName

      - name: Notarize and staple the distributable DMG
        if: >-
          matrix.id == 'mac' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' &&
            github.ref_name == github.event.repository.default_branch &&
            inputs.candidate_ref == github.event.repository.default_branch &&
            (inputs.target == 'mac' || inputs.target == 'all')))
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          DMG=$(find release/electron -maxdepth 1 -name '*.dmg' -print -quit)
          if [ -z "$DMG" ]; then
            echo "::error::DMG is missing after electron-builder." >&2
            exit 1
          fi
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/authkey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Verify Apple signature and notarization ticket
        if: >-
          matrix.id == 'mac' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' &&
            github.ref_name == github.event.repository.default_branch &&
            inputs.candidate_ref == github.event.repository.default_branch &&
            (inputs.target == 'mac' || inputs.target == 'all')))
        run: |
          set -euo pipefail
          APP=$(find release/electron -type d -name '*.app' -print -quit)
          DMG=$(find release/electron -maxdepth 1 -name '*.dmg' -print -quit)
          if [ -z "$APP" ] || [ -z "$DMG" ]; then
            echo "::error::Signed .app or .dmg is missing." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=4 "$APP"
          codesign -dvvv "$APP" 2>&1 | grep -E 'Authority=Developer ID Application'
          codesign -dvvv "$APP" 2>&1 | grep -E 'flags=.*runtime'
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"

      - name: Create the Tauri-compatible macOS bridge archive
        if: matrix.id == 'mac'
        env:
          VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          set -euo pipefail
          APP=$(find release/electron -type d -name '*.app' -print -quit)
          case "$(uname -m)" in
            x86_64) ARCH=x64 ;;
            arm64) ARCH=arm64 ;;
            *) echo "::error::Unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          tar -czf "release/electron/Grimodex-${VERSION}-mac-${ARCH}.app.tar.gz" \
            -C "$(dirname "$APP")" "$(basename "$APP")"

      - name: Require electron-updater metadata for this host
        run: >-
          node scripts/verify-electron-updater-metadata.mjs
          --metadata "release/electron/${{ matrix.updaterMetadata }}"

      - name: Upload host packages and electron-updater metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/electron/*.AppImage
            release/electron/*.deb
            release/electron/*.rpm
            release/electron/*.dmg
            release/electron/*.zip
            release/electron/*.app.tar.gz
            release/electron/*.exe
            release/electron/*.blockmap
            release/electron/latest*.yml
          if-no-files-found: error
          retention-days: 7

  build-arch:
    name: Build Electron (arch pacman package)
    needs: [release-gate, build]
    # Arch pkgver/pkgrel cannot preserve arbitrary SemVer prerelease ordering.
    # Pre-release users use AppImage/deb/rpm; the pacman/AUR package starts at
    # each stable release so the later stable version is always an upgrade.
    if: >-
      always() &&
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      needs.release-gate.outputs.should_publish == 'true' &&
      needs.release-gate.outputs.prerelease == 'false' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-gate.outputs.checkout_ref }}

      - name: Install Arch packaging tools
        run: pacman -Syu --noconfirm --needed pacman-contrib jq git

      - name: Download Electron Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-linux
          path: packaging/arch

      - name: Repackage the Electron deb with makepkg
        env:
          VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          set -euo pipefail
          cd packaging/arch
          mapfile -t DEBS < <(find . -maxdepth 1 -type f \
            -name "Grimodex-${VERSION}-linux-*.deb" | sort)
          if [ "${#DEBS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Electron deb, found ${#DEBS[@]}." >&2
            exit 1
          fi
          DEB=$(basename "${DEBS[0]}")
          if [ "$DEB" != "Grimodex-${VERSION}-linux-amd64.deb" ]; then
            echo "::error::Unexpected deb architecture name: $DEB" >&2
            exit 1
          fi
          sed "s/@PKGVER@/${VERSION}/" PKGBUILD > PKGBUILD.tmp
          mv PKGBUILD.tmp PKGBUILD
          cp ../../LICENSE "LICENSE-v${VERSION}"
          useradd -m builder
          chown -R builder: .
          runuser -u builder -- updpkgsums
          runuser -u builder -- makepkg -fd
          mapfile -t PACKAGES < <(find . -maxdepth 1 -name '*.pkg.tar.zst' | sort)
          if [ "${#PACKAGES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Arch package, found ${#PACKAGES[@]}." >&2
            exit 1
          fi
          rm -rf package-check
          mkdir package-check
          bsdtar -xf "${PACKAGES[0]}" -C package-check
          test -x package-check/opt/Grimodex/grimodex
          test "$(readlink package-check/usr/bin/grimodex)" = '/opt/Grimodex/grimodex'
          test "$(cat package-check/opt/Grimodex/resources/grimodex-package-channel)" = arch
          test "$(stat -c '%a' package-check/opt/Grimodex/chrome-sandbox)" = 755
          ls -l "${PACKAGES[0]}"

      - name: Upload Arch package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electron-arch
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  publish-debug:
    name: Verify publish stage from existing artifacts
    needs: [release-gate, bridge-signing-preflight]
    if: >-
      always() &&
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref_name == github.event.repository.default_branch &&
      inputs.target == 'publish' &&
      inputs.publish == false &&
      inputs.recover_draft == false &&
      inputs.candidate_ref == github.event.repository.default_branch &&
      needs.release-gate.result == 'success' &&
      needs.release-gate.outputs.target == 'publish' &&
      needs.release-gate.outputs.should_publish != 'true' &&
      needs.bridge-signing-preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-gate.outputs.checkout_ref }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify source release run identity
        id: source-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ needs.release-gate.outputs.source_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ needs.release-gate.outputs.version }}
          TAG: ${{ needs.release-gate.outputs.tag }}
        run: |
          set -euo pipefail
          RUN_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")
          STATUS=$(jq -r .status <<<"$RUN_JSON")
          CONCLUSION=$(jq -r .conclusion <<<"$RUN_JSON")
          EVENT=$(jq -r .event <<<"$RUN_JSON")
          WORKFLOW_PATH=$(jq -r .path <<<"$RUN_JSON")
          HEAD_BRANCH=$(jq -r .head_branch <<<"$RUN_JSON")
          SOURCE_SHA=$(jq -r .head_sha <<<"$RUN_JSON")
          if [ "$STATUS" != "completed" ]; then
            echo "::error::Source run is not completed: $STATUS" >&2
            exit 1
          fi
          if [ "$WORKFLOW_PATH" != ".github/workflows/release.yml" ]; then
            echo "::error::Source run uses an unexpected workflow path: $WORKFLOW_PATH" >&2
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$HEAD_BRANCH" != "$DEFAULT_BRANCH" ] || [ "$CONCLUSION" != "success" ]; then
              echo "::error::Debug source run must be a successful default-branch run." >&2
              exit 1
            fi
          elif [ "$EVENT" = "push" ]; then
            if [ "$HEAD_BRANCH" != "$TAG" ]; then
              echo "::error::Source run tag mismatch: expected ${TAG}, got ${HEAD_BRANCH}" >&2
              exit 1
            fi
            TAG_REF_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")
            TAG_OBJECT_TYPE=$(jq -r .object.type <<<"$TAG_REF_JSON")
            TAG_OBJECT_SHA=$(jq -r .object.sha <<<"$TAG_REF_JSON")
            if [ "$TAG_OBJECT_TYPE" = "tag" ]; then
              TAG_OBJECT_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT_SHA}")
              TAG_OBJECT_TYPE=$(jq -r .object.type <<<"$TAG_OBJECT_JSON")
              TAG_OBJECT_SHA=$(jq -r .object.sha <<<"$TAG_OBJECT_JSON")
            fi
            if [ "$TAG_OBJECT_TYPE" != "commit" ] || [ "$TAG_OBJECT_SHA" != "$SOURCE_SHA" ]; then
              echo "::error::Source run SHA does not match ${TAG}: ${SOURCE_SHA}" >&2
              exit 1
            fi
          else
            echo "::error::Source run must be a tag push or trusted debug run." >&2
            exit 1
          fi
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Reusing successful host artifacts from run ${SOURCE_RUN_ID} at ${SOURCE_SHA}."

      - name: Download the successful Linux artifact from the source run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-linux
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-gate.outputs.source_run_id }}

      - name: Download the successful macOS artifact from the source run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-mac
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-gate.outputs.source_run_id }}

      - name: Download the successful Windows artifact from the source run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-windows
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-gate.outputs.source_run_id }}

      - name: Sign reused installers and generate a dry-run bridge manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.release-gate.outputs.version }}
          TAG: ${{ needs.release-gate.outputs.tag }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          PUBKEY_FILE="packaging/tauri-v1/updater-public-key.pub"
          mapfile -t BRIDGE_ASSETS < <(find release-assets -maxdepth 1 -type f \
            \( -name "Grimodex-${VERSION}-windows-*.exe" \
            -o -name "Grimodex-${VERSION}-mac-*.app.tar.gz" \
            -o -name "Grimodex-${VERSION}-linux-*.AppImage" \
            -o -name "Grimodex-${VERSION}-linux-*.deb" \
            -o -name "Grimodex-${VERSION}-linux-*.rpm" \) | sort)
          if [ "${#BRIDGE_ASSETS[@]}" -eq 0 ]; then
            echo "::error::No reusable Electron installers matched the Tauri bridge contract." >&2
            exit 1
          fi
          for asset in "${BRIDGE_ASSETS[@]}"; do
            pnpm tauri signer sign "$asset"
            test -s "${asset}.sig"
            DECODED_SIGNATURE="$RUNNER_TEMP/$(basename "$asset").minisig"
            base64 --decode "${asset}.sig" > "$DECODED_SIGNATURE"
            minisign -Vm "$asset" -x "$DECODED_SIGNATURE" -p "$PUBKEY_FILE"
          done
          PUB_DATE=$(git show -s --format=%cI HEAD)
          node scripts/generate-tauri-bridge-manifest.mjs \
            --assets-dir release-assets \
            --version "$VERSION" \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --notes "Grimodex Electron v${VERSION} migration bridge debug" \
            --pub-date "$PUB_DATE" \
            --output release-assets/latest.json

      - name: Preserve publish-debug evidence without mutating a release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publish-debug-${{ needs.release-gate.outputs.version }}-${{ github.run_id }}
          path: |
            release-assets/latest.json
            release-assets/*.sig
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Assemble one Draft Release
    needs:
      - release-gate
      - release-state
      - ci
      - bridge-signing-preflight
      - build
      - build-arch
    if: >-
      always() &&
      !cancelled() &&
      needs.release-gate.result == 'success' &&
      needs.release-state.result == 'success' &&
      ((github.event_name == 'push' &&
        github.ref_type == 'tag' &&
        needs.release-gate.outputs.should_publish == 'true' &&
        needs.ci.result == 'success' &&
        needs.build.result == 'success' &&
        ((needs.release-gate.outputs.prerelease == 'true' &&
          needs.bridge-signing-preflight.result == 'skipped' &&
          needs.build-arch.result == 'skipped') ||
         (needs.release-gate.outputs.prerelease == 'false' &&
          needs.bridge-signing-preflight.result == 'success' &&
          needs.build-arch.result == 'success'))) ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref_name == github.event.repository.default_branch &&
        inputs.target == 'publish' &&
        inputs.publish == false &&
        inputs.recover_draft == true &&
        inputs.candidate_ref == github.event.repository.default_branch &&
        needs.release-gate.outputs.recover_draft == 'true' &&
        needs.release-gate.outputs.should_publish != 'true' &&
        needs.release-state.outputs.complete != 'true' &&
        needs.ci.result == 'skipped' &&
        needs.build.result == 'skipped' &&
        needs.build-arch.result == 'skipped' &&
        needs.bridge-signing-preflight.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-gate.outputs.checkout_ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compose bilingual Draft Release notes
        env:
          TAG: ${{ needs.release-gate.outputs.tag }}
          VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_NOTES_FILE="$RUNNER_TEMP/github-release-notes.md"
          node scripts/compose-github-release-notes.mjs \
            --tag "$TAG" \
            --ja "public/RELEASE_NOTES/v${VERSION}.ja.md" \
            --en "public/RELEASE_NOTES/v${VERSION}.en.md" \
            --output "$RELEASE_NOTES_FILE"
          echo "RELEASE_NOTES_FILE=$RELEASE_NOTES_FILE" >> "$GITHUB_ENV"

      - name: Download all host artifacts into one directory
        if: github.event_name == 'push'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: electron-*
          path: release-assets
          merge-multiple: true

      - name: Verify the failed immutable source release
        id: recovery-source
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.recover_draft == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ needs.release-gate.outputs.source_run_id }}
          TAG: ${{ needs.release-gate.outputs.tag }}
          VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          set -euo pipefail
          RUN_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")
          STATUS=$(jq -r .status <<<"$RUN_JSON")
          CONCLUSION=$(jq -r .conclusion <<<"$RUN_JSON")
          EVENT=$(jq -r .event <<<"$RUN_JSON")
          WORKFLOW_PATH=$(jq -r .path <<<"$RUN_JSON")
          HEAD_BRANCH=$(jq -r .head_branch <<<"$RUN_JSON")
          SOURCE_SHA=$(jq -r .head_sha <<<"$RUN_JSON")
          if [ "$STATUS" != "completed" ] || [ "$CONCLUSION" != "failure" ]; then
            echo "::error::Draft recovery requires one completed failed source run." >&2
            exit 1
          fi
          if [ "$EVENT" != "push" ] ||
             [ "$WORKFLOW_PATH" != ".github/workflows/release.yml" ]; then
            echo "::error::Source run is not an Electron v2 tag release." >&2
            exit 1
          fi
          if [ "$HEAD_BRANCH" != "$TAG" ]; then
            echo "::error::Source run tag mismatch: expected ${TAG}, got ${HEAD_BRANCH}" >&2
            exit 1
          fi
          TAG_REF_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")
          TAG_OBJECT_TYPE=$(jq -r .object.type <<<"$TAG_REF_JSON")
          TAG_OBJECT_SHA=$(jq -r .object.sha <<<"$TAG_REF_JSON")
          if [ "$TAG_OBJECT_TYPE" != "tag" ]; then
            echo "::error::Draft recovery requires an annotated release tag: ${TAG}" >&2
            exit 1
          fi
          TAG_OBJECT_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT_SHA}")
          TAG_OBJECT_TYPE=$(jq -r .object.type <<<"$TAG_OBJECT_JSON")
          TAG_OBJECT_SHA=$(jq -r .object.sha <<<"$TAG_OBJECT_JSON")
          if [ "$TAG_OBJECT_TYPE" != "commit" ] || [ "$TAG_OBJECT_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::Source run SHA does not match immutable tag ${TAG}: ${SOURCE_SHA}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SOURCE_SHA" HEAD; then
            echo "::error::Source release is not an ancestor of trusted master: ${SOURCE_SHA}" >&2
            exit 1
          fi
          for RELEASE_FILE in \
            package.json \
            "public/RELEASE_NOTES/v${VERSION}.ja.md" \
            "public/RELEASE_NOTES/v${VERSION}.en.md" \
            packaging/tauri-v1/updater-public-key.pub \
            src-tauri/tauri.conf.json; do
            SOURCE_BLOB=$(git rev-parse "${SOURCE_SHA}:${RELEASE_FILE}")
            TRUSTED_BLOB=$(git rev-parse "HEAD:${RELEASE_FILE}")
            if [ "$SOURCE_BLOB" != "$TRUSTED_BLOB" ]; then
              echo "::error::Trusted recovery content differs from ${TAG}: ${RELEASE_FILE}" >&2
              exit 1
            fi
          done

          JOBS_JSON=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?filter=latest&per_page=100")
          JOBS_TOTAL=$(jq -r .total_count <<<"$JOBS_JSON")
          if ! [[ "$JOBS_TOTAL" =~ ^[0-9]+$ ]] || [ "$JOBS_TOTAL" -gt 100 ]; then
            echo "::error::Source run job count exceeds the verified API page: ${JOBS_TOTAL}" >&2
            exit 1
          fi
          for REQUIRED_JOB in \
            "Build Electron (windows)" \
            "Build Electron (linux)" \
            "Build Electron (mac)" \
            "Build Electron (arch pacman package)"; do
            MATCHES=$(jq --arg name "$REQUIRED_JOB" \
              '[.jobs[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length' \
              <<<"$JOBS_JSON")
            if [ "$MATCHES" -ne 1 ]; then
              echo "::error::Required source job is not uniquely successful: ${REQUIRED_JOB}" >&2
              exit 1
            fi
          done
          FAILED_ASSEMBLY=$(jq \
            '[.jobs[] | select(.name == "Assemble one Draft Release" and .conclusion == "failure")] | length' \
            <<<"$JOBS_JSON")
          if [ "$FAILED_ASSEMBLY" -ne 1 ]; then
            echo "::error::Source run did not fail in Draft assembly." >&2
            exit 1
          fi

          ARTIFACTS_JSON=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100")
          ARTIFACTS_TOTAL=$(jq -r .total_count <<<"$ARTIFACTS_JSON")
          if ! [[ "$ARTIFACTS_TOTAL" =~ ^[0-9]+$ ]] || [ "$ARTIFACTS_TOTAL" -gt 100 ]; then
            echo "::error::Source run artifact count exceeds the verified API page: ${ARTIFACTS_TOTAL}" >&2
            exit 1
          fi
          for REQUIRED_ARTIFACT in \
            electron-windows electron-linux electron-mac electron-arch; do
            MATCHES=$(jq --arg name "$REQUIRED_ARTIFACT" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
              <<<"$ARTIFACTS_JSON")
            if [ "$MATCHES" -ne 1 ]; then
              echo "::error::Required source artifact is missing, duplicated, or expired: ${REQUIRED_ARTIFACT}" >&2
              exit 1
            fi
            ARTIFACT_ID=$(jq -r --arg name "$REQUIRED_ARTIFACT" \
              '.artifacts[] | select(.name == $name and .expired == false) | .id' \
              <<<"$ARTIFACTS_JSON")
            if ! [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Required source artifact has an invalid ID: ${REQUIRED_ARTIFACT}" >&2
              exit 1
            fi
            OUTPUT_NAME=${REQUIRED_ARTIFACT#electron-}
            OUTPUT_NAME=${OUTPUT_NAME//-/_}
            echo "${OUTPUT_NAME}_artifact_id=${ARTIFACT_ID}" >> "$GITHUB_OUTPUT"
          done
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Recovering Draft ${TAG} from run ${SOURCE_RUN_ID} at ${SOURCE_SHA}."

      - name: Download the successful Linux artifact from the failed source run
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.recover_draft == true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.recovery-source.outputs.linux_artifact_id }}
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-gate.outputs.source_run_id }}

      - name: Download the successful macOS artifact from the failed source run
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.recover_draft == true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.recovery-source.outputs.mac_artifact_id }}
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-gate.outputs.source_run_id }}

      - name: Download the successful Windows artifact from the failed source run
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.recover_draft == true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.recovery-source.outputs.windows_artifact_id }}
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-gate.outputs.source_run_id }}

      - name: Download the successful Arch artifact from the failed source run
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.recover_draft == true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.recovery-source.outputs.arch_artifact_id }}
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-gate.outputs.source_run_id }}

      - name: Detect an already completed immutable bridge release
        id: release-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-gate.outputs.tag }}
          VERSION: ${{ needs.release-gate.outputs.version }}
          PRERELEASE: ${{ needs.release-gate.outputs.prerelease }}
        run: |
          set -euo pipefail
          echo "complete=false" >> "$GITHUB_OUTPUT"
          if [ "$PRERELEASE" != "false" ]; then
            exit 0
          fi
          RELEASES_JSON="$RUNNER_TEMP/releases.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RELEASES_JSON"
          RELEASE_MATCH_COUNT=$(jq --arg tag "$TAG" \
            '[.[][] | select(.tag_name == $tag)] | length' "$RELEASES_JSON")
          if [ "$RELEASE_MATCH_COUNT" -gt 1 ]; then
            echo "::error::Multiple GitHub releases use tag ${TAG}." >&2
            exit 1
          fi
          if [ "$RELEASE_MATCH_COUNT" -eq 0 ]; then
            exit 0
          fi
          LATEST_ASSET_COUNT=$(jq --arg tag "$TAG" \
            '[.[][] | select(.tag_name == $tag) | .assets[]? | select(.name == "latest.json")] | length' \
            "$RELEASES_JSON")
          if [ "$LATEST_ASSET_COUNT" -gt 1 ]; then
            echo "::error::Release ${TAG} has multiple latest.json assets." >&2
            exit 1
          fi
          if [ "$LATEST_ASSET_COUNT" -eq 0 ]; then
            exit 0
          fi
          LATEST_ASSET_ID=$(jq -r --arg tag "$TAG" \
            '.[][] | select(.tag_name == $tag) | .assets[]? | select(.name == "latest.json") | .id' \
            "$RELEASES_JSON")
          mkdir -p existing-release-assets
          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${LATEST_ASSET_ID}" \
            > existing-release-assets/latest.json
          cp existing-release-assets/latest.json release-assets/latest.json
          node --input-type=module -e \
            "import fs from 'node:fs'; import {validateBridgeManifestSchema} from './scripts/generate-tauri-bridge-manifest.mjs'; const m=JSON.parse(fs.readFileSync('release-assets/latest.json','utf8')); validateBridgeManifestSchema(m); if(m.version!==process.env.VERSION) throw new Error('Existing bridge version mismatch');"
          echo "complete=true" >> "$GITHUB_OUTPUT"

      - name: Sign Electron installers for the final Tauri v1 bridge
        if: >-
          needs.release-gate.outputs.prerelease == 'false' &&
          steps.release-state.outputs.complete != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for stable bridge latest.json." >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          PUBKEY_FILE="packaging/tauri-v1/updater-public-key.pub"
          EMBEDDED_PUBKEY_FILE="$RUNNER_TEMP/tauri-updater-embedded.pub"
          node -e "const c=require('./src-tauri/tauri.conf.json');process.stdout.write(Buffer.from(c.plugins.updater.pubkey,'base64'))" \
            > "$EMBEDDED_PUBKEY_FILE"
          test -s "$PUBKEY_FILE"
          if ! cmp -s "$PUBKEY_FILE" "$EMBEDDED_PUBKEY_FILE"; then
            echo "::error::Current Tauri updater public key differs from the frozen bridge key." >&2
            exit 1
          fi
          mapfile -t BRIDGE_ASSETS < <(find release-assets -maxdepth 1 -type f \
            \( -name "Grimodex-${VERSION}-windows-*.exe" \
            -o -name "Grimodex-${VERSION}-mac-*.app.tar.gz" \
            -o -name "Grimodex-${VERSION}-linux-*.AppImage" \
            -o -name "Grimodex-${VERSION}-linux-*.deb" \
            -o -name "Grimodex-${VERSION}-linux-*.rpm" \) | sort)
          if [ "${#BRIDGE_ASSETS[@]}" -eq 0 ]; then
            echo "::error::No Electron installers matched the Tauri bridge contract." >&2
            exit 1
          fi
          for asset in "${BRIDGE_ASSETS[@]}"; do
            pnpm tauri signer sign "$asset"
            test -s "${asset}.sig"
            DECODED_SIGNATURE="$RUNNER_TEMP/$(basename "$asset").minisig"
            base64 --decode "${asset}.sig" > "$DECODED_SIGNATURE"
            minisign -Vm "$asset" -x "$DECODED_SIGNATURE" -p "$PUBKEY_FILE"
          done

      - name: Generate immutable bridge latest.json for stable v1 clients
        if: >-
          needs.release-gate.outputs.prerelease == 'false' &&
          steps.release-state.outputs.complete != 'true'
        env:
          VERSION: ${{ needs.release-gate.outputs.version }}
          TAG: ${{ needs.release-gate.outputs.tag }}
          SOURCE_SHA: ${{ steps.recovery-source.outputs.source_sha || needs.release-gate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          PUB_DATE=$(git show -s --format=%cI "$SOURCE_SHA")
          node scripts/generate-tauri-bridge-manifest.mjs \
            --assets-dir release-assets \
            --version "$VERSION" \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --notes "Grimodex Electron v${VERSION} migration bridge" \
            --pub-date "$PUB_DATE" \
            --output release-assets/latest.json

      - name: Preserve bridge manifest as a workflow artifact
        if: needs.release-gate.outputs.prerelease == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-v1-bridge-${{ needs.release-gate.outputs.version }}
          path: release-assets/latest.json
          if-no-files-found: error
          retention-days: 90

      - name: Create or update the single draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-gate.outputs.tag }}
          VERSION: ${{ needs.release-gate.outputs.version }}
          PRERELEASE: ${{ needs.release-gate.outputs.prerelease }}
          RELEASE_COMPLETE: ${{ steps.release-state.outputs.complete }}
          RECOVER_DRAFT: ${{ needs.release-gate.outputs.recover_draft }}
          SOURCE_SHA: ${{ steps.recovery-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_COMPLETE" = "true" ]; then
            echo "Immutable bridge latest.json already exists; release is complete and will not be mutated."
            exit 0
          fi

          if [ "$RECOVER_DRAFT" = "true" ]; then
            TAG_REF_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")
            TAG_OBJECT_TYPE=$(jq -r .object.type <<<"$TAG_REF_JSON")
            TAG_OBJECT_SHA=$(jq -r .object.sha <<<"$TAG_REF_JSON")
            if [ "$TAG_OBJECT_TYPE" != "tag" ]; then
              echo "::error::Draft recovery tag is no longer annotated: ${TAG}" >&2
              exit 1
            fi
            TAG_OBJECT_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT_SHA}")
            TAG_OBJECT_TYPE=$(jq -r .object.type <<<"$TAG_OBJECT_JSON")
            TAG_OBJECT_SHA=$(jq -r .object.sha <<<"$TAG_OBJECT_JSON")
            if [ "$TAG_OBJECT_TYPE" != "commit" ] || [ "$TAG_OBJECT_SHA" != "$SOURCE_SHA" ]; then
              echo "::error::Draft recovery tag moved before Release mutation: ${TAG}" >&2
              exit 1
            fi
          fi

          RELEASES_JSON="$RUNNER_TEMP/releases-before-mutation.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RELEASES_JSON"
          RELEASE_MATCH_COUNT=$(jq --arg tag "$TAG" \
            '[.[][] | select(.tag_name == $tag)] | length' "$RELEASES_JSON")
          if [ "$RELEASE_MATCH_COUNT" -gt 1 ]; then
            echo "::error::Multiple GitHub releases use tag ${TAG}." >&2
            exit 1
          fi
          if [ "$RELEASE_MATCH_COUNT" -eq 1 ]; then
            RELEASE_ID=$(jq -r --arg tag "$TAG" \
              '.[][] | select(.tag_name == $tag) | .id' "$RELEASES_JSON")
            IS_DRAFT=$(jq -r --arg tag "$TAG" \
              '.[][] | select(.tag_name == $tag) | .draft' "$RELEASES_JSON")
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Refusing to mutate an already published release without latest.json." >&2
              exit 1
            fi
            UPDATE_JSON="$RUNNER_TEMP/release-update.json"
            jq -n \
              --arg name "Grimodex v${VERSION}" \
              --rawfile body "$RELEASE_NOTES_FILE" \
              --argjson prerelease "$PRERELEASE" \
              '{name: $name, body: $body, draft: true, prerelease: $prerelease}' \
              > "$UPDATE_JSON"
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              --input "$UPDATE_JSON" >/dev/null
          else
            CREATE_ARGS=(--draft --verify-tag --title "Grimodex v${VERSION}" \
              --notes-file "$RELEASE_NOTES_FILE")
            if [ "$PRERELEASE" = "true" ]; then
              CREATE_ARGS+=(--prerelease)
            fi
            gh release create "$TAG" "${CREATE_ARGS[@]}"
          fi

          mapfile -t RELEASE_ASSETS < <(find release-assets -maxdepth 1 -type f | sort)
          for asset in "${RELEASE_ASSETS[@]}"; do
            if [ "$(basename "$asset")" = "latest.json" ]; then
              continue
            fi
            gh release upload "$TAG" "$asset" --clobber
          done
          if [ "$PRERELEASE" = "false" ]; then
            # Completion marker: upload only after every installer, signature,
            # and electron-updater metadata asset succeeded. Never clobber it.
            gh release upload "$TAG" release-assets/latest.json
          fi

      - name: Verify Draft identity and exact body through the GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-gate.outputs.tag }}
          PRERELEASE: ${{ needs.release-gate.outputs.prerelease }}
        run: |
          set -euo pipefail
          RELEASES_JSON="$RUNNER_TEMP/releases-after-mutation.json"
          RELEASE_JSON="$RUNNER_TEMP/release.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RELEASES_JSON"
          RELEASE_MATCH_COUNT=$(jq --arg tag "$TAG" \
            '[.[][] | select(.tag_name == $tag)] | length' "$RELEASES_JSON")
          if [ "$RELEASE_MATCH_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one Draft release for ${TAG}; found ${RELEASE_MATCH_COUNT}." >&2
            exit 1
          fi
          jq --arg tag "$TAG" \
            '.[][] | select(.tag_name == $tag)' "$RELEASES_JSON" > "$RELEASE_JSON"
          node --input-type=module -e \
            "import fs from 'node:fs'; const release=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); const expectedBody=fs.readFileSync(process.env.RELEASE_NOTES_FILE,'utf8'); const expectedPrerelease=process.env.PRERELEASE==='true'; if(release.tag_name!==process.env.TAG) throw new Error('Draft tag mismatch'); if(release.draft!==true) throw new Error('Release must remain a Draft'); if(release.prerelease!==expectedPrerelease) throw new Error('Draft prerelease state mismatch'); if(release.body!==expectedBody) throw new Error('Draft body does not match authored release notes'); if(!Number.isSafeInteger(release.id) || release.id <= 0) throw new Error('Draft release ID is invalid'); console.log('Draft Release verified:', release.html_url);" \
            "$RELEASE_JSON"
