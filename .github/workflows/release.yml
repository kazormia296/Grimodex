name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "ドラフトリリースとして作成する"
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.platform }})
    needs: ci
    permissions:
      contents: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # ort の prebuilt ONNX Runtime は glibc 2.38+ でビルドされており
          # __isoc23_strtol 等を参照する。ubuntu-22.04 (glibc 2.35) では
          # rust-lld が undefined symbol で落ちるため 24.04 以上必須。
          - platform: ubuntu-24.04
          - platform: macos-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Linux 依存ライブラリのインストール
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          # GitHub Actions ランナー同梱の Microsoft apt リポジトリ(azure-cli / prod)が
          # 403 / "no longer signed" を返し apt-get update を中断させることがある。
          # 依存はすべて Ubuntu 標準アーカイブ由来で Microsoft リポジトリは不要なため、
          # update 前に該当ソースを除去する。
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config \
            build-essential \
            libdbus-1-dev \
            libsecret-1-dev
        env:
          DEBIAN_FRONTEND: noninteractive

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - run: pnpm install --frozen-lockfile

      # ライセンス機構 (ライセンス認証設計書 §9.1): v1.0.0 以降のリリースのみ
      # `licensing` feature を有効化。バージョン由来の自動判定なので入力ミスが
      # 入らない (ベータ v0.x は常に無効)。Settings > About でも目視確認可。
      - name: licensing feature の判定 (v1.0.0 以降のみ有効)
        id: licensing
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          MAJOR="${VERSION%%.*}"
          if [ "$MAJOR" -ge 1 ]; then
            echo "args=--features licensing" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      # updater 署名の公開鍵がプレースホルダのままだと、配信後に全更新の署名
      # 検証が必ず失敗する (実機で気づけない)。v1.0.0 以降のビルドで差し替え忘れを
      # ここで落とす。
      - name: updater pubkey が本番用に差し替え済みか検証 (v1.0.0 以降)
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          MAJOR="${VERSION%%.*}"
          PUBKEY=$(node -p "require('./src-tauri/tauri.conf.json').plugins?.updater?.pubkey || ''")
          if [ "$MAJOR" -ge 1 ] && { [ -z "$PUBKEY" ] || [ "$PUBKEY" = "__REPLACE_WITH_UPDATER_PUBKEY__" ]; }; then
            echo "::error::updater pubkey がプレースホルダのままです。pnpm tauri signer generate で生成した公開鍵に差し替えてください。" >&2
            exit 1
          fi

      - name: Tauri ビルド & リリース作成
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS コード署名（将来対応）
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows / アップデーター署名（updater/NSIS 署名鍵。GitHub Secrets に登録）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          # updater overlay (createUpdaterArtifacts) を release ビルドのみ合成。
          args: ${{ steps.licensing.outputs.args }} --config src-tauri/tauri.updater.conf.json
          includeUpdaterJson: true
          tagName: v__VERSION__
          releaseName: "Grimodex v__VERSION__"
          releaseBody: |
            Grimodex v__VERSION__ をリリースしました。

            ## インストール方法
            下記 Assets から各プラットフォームのインストーラーをダウンロードしてください。

            | OS | ファイル |
            |----|---------|
            | Linux (Debian/Ubuntu) | `.deb` |
            | Linux (Universal) | `.AppImage` |
            | macOS | `.dmg` |
            | Windows | `.exe` |

            ---
            <!-- リリースノートをここに追記してください -->
          # タグ push 時は常に Draft。手動実行時は inputs.draft（デフォルト true）で制御
          releaseDraft: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
          prerelease: ${{ contains(github.ref_name, '-') }}
