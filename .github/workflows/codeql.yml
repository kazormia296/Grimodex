name: CodeQL

# advanced setup。GitHub の default setup を置き換える。
# 目的: Rust の解析品質("Low Rust analysis quality"警告)の改善。
#
# 経緯: system 依存の追加では call target 解決率は 48% から動かなかった
# (主因は FFI ではなく proc-macro 展開と依存本体の非抽出)。そこで
# extractor オプション extract_dependencies_as_source=true で依存の全ソースを
# 抽出し、call target が閾値(50%)を超えるか検証する。
#
# 注意: このワークフローを有効にするにはリポジトリ設定で CodeQL の default setup を
# 無効化する必要がある(default と advanced は併用不可)。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    env:
      # Rust extractor のみ反応する(他言語では no-op)。依存の全ソースを抽出して
      # trait/impl 解決を補い call target 解決率の向上を狙う実験設定。抽出は重くなる。
      CODEQL_EXTRACTOR_RUST_OPTION_EXTRACT_DEPENDENCIES_AS_SOURCE: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # 共有 Rust crate の build script 用。凍結した Tauri shell は解析時に
      # build しないため WebKitGTK / AppIndicator は不要。
      - name: システム依存ライブラリのインストール (Rust)
        if: matrix.language == 'rust'
        run: |
          # GitHub Actions ランナー同梱の Microsoft apt リポジトリ(azure-cli / prod)が
          # 403 / "no longer signed" を返し apt-get update を中断させることがある。
          # 依存はすべて Ubuntu 標準アーカイブ由来で Microsoft リポジトリは不要なため、
          # update 前に該当ソースを除去する。
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libssl-dev
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Rust ツールチェーン (Rust)
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Rust 依存キャッシュ (Rust)
        if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: CodeQL 初期化
        uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: CodeQL 解析
        uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          category: "/language:${{ matrix.language }}"
