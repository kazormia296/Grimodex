name: Format PR 474 review fix

on:
  push:
    branches:
      - agent/dialogue-paragraph-indent

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/dialogue-paragraph-indent
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            src/features/editor/ParagraphIndentPlugin.test.ts \
            src/features/editor/ParagraphIndentPlugin.ts \
            src/features/editor/extensions.ts \
            src/features/export/exportEngine.ts \
            src/features/export/paragraphIndentDialogue.test.ts \
            src/lib/paragraphIndentPolicy.ts
          rm .github/workflows/format-pr474-review-fix.yml

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add -A
          git commit -m "style: format paragraph indent review fix"
          git push origin "HEAD:agent/dialogue-paragraph-indent"
