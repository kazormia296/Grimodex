name: Cloudflare Web Editor Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare Pages environment to deploy
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: cloudflare-web-editor-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: Deploy Web Editor (${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }})
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        (
          inputs.environment != 'production' ||
          github.ref == 'refs/heads/master'
        )
      ) ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CF_PAGES_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'workflow_run' &&
            github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID GitHub Actions secret is required."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN GitHub Actions secret is required."
            exit 1
          fi

      - name: Build Web Editor
        run: pnpm editor:cloudflare web-build "$CF_PAGES_ENVIRONMENT"

      - name: Verify deployed revision is current master
        id: current_master
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          current_master_sha="$(git rev-parse refs/remotes/origin/master)"
          node scripts/cloudflare-editor-deploy-guard.mjs \
            "$WORKFLOW_RUN_HEAD_SHA" \
            "$current_master_sha"

      - name: Deploy Web Editor
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.current_master.outputs.deploy == 'true'
        run: pnpm editor:cloudflare web-deploy-artifact "$CF_PAGES_ENVIRONMENT"
