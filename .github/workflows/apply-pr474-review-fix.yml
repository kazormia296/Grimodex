name: Apply PR 474 review fix

on:
  push:
    branches:
      - agent/dialogue-paragraph-indent

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/dialogue-paragraph-indent
          fetch-depth: 0

      - name: Apply renderer-level paragraph policy
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return source.replace(old, new, 1)

          export_core_path = Path("src/features/export/exportEngineCore.ts")
          export_text = export_core_path.read_text(encoding="utf-8")

          export_text = replace_once(
              export_text,
              '''import {
            tateChuYokoRunAllowed,
            TATE_CHU_YOKO_RUN,
            type TateChuYokoPolicy,
          } from "@/features/editor/tateChuYokoPolicy";
          ''',
              '''import {
            tateChuYokoRunAllowed,
            TATE_CHU_YOKO_RUN,
            type TateChuYokoPolicy,
          } from "@/features/editor/tateChuYokoPolicy";
          import { shouldApplyAutomaticParagraphIndent } from "@/lib/paragraphIndentPolicy";
          ''',
              "export policy import",
          )

          export_text = replace_once(
              export_text,
              '''/** Whether the paragraph already begins with author-entered whitespace. */
          function nodeStartsWithWhitespace(node: PMNode): boolean {
            if (node.type === "text") return /^\\s/u.test(node.text ?? "");
            if (node.type === "ruby") {
              return /^\\s/u.test(String(node.attrs?.base ?? ""));
            }
            if (node.type === "hardBreak") return true;
            for (const child of node.content ?? []) {
              if (child.type === "sceneBeat") continue;
              if (child.type === "text" && (child.text ?? "").length === 0) continue;
              return nodeStartsWithWhitespace(child);
            }
            return false;
          }
          ''',
              '''/**
           * Return the first user-visible text represented by a node. Unknown leaf
           * nodes count as visible content so an inline atom before dialogue does not
           * accidentally suppress indentation. sceneBeat is display metadata and is
           * skipped, matching the editor decoration policy.
           */
          function firstRenderedText(node: PMNode): string {
            if (node.type === "text") return node.text ?? "";
            if (node.type === "ruby") return String(node.attrs?.base ?? "");
            if (node.type === "hardBreak") return "\\n";
            if (node.type === "sceneBeat") return "";

            if (node.content) {
              for (const child of node.content) {
                const text = firstRenderedText(child);
                if (text.length > 0) return text;
              }
              return "";
            }

            return "\\uFFFC";
          }
          ''',
              "leading content helper",
          )

          paragraph_start = export_text.index(
              '      const paragraphIndent = topLevel\n'
          )
          paragraph_end = export_text.index(
              '      return renderedInner + "\\n";\n', paragraph_start
          )
          paragraph_block = '''      const paragraphIndent = topLevel
                ? (ctx.settings.paragraphIndent ?? "none")
                : "none";
              const shouldIndent =
                paragraphIndent !== "none" &&
                shouldApplyAutomaticParagraphIndent(firstRenderedText(node));
              const renderedInner =
                paragraphIndent === "fullwidth-space" && shouldIndent
                  ? "\\u3000" + inner
                  : inner;

              if (rendersHtmlParagraphs(ctx)) {
                const className =
                  paragraphIndent === "css" && shouldIndent
                    ? ' class="paragraph-indent"'
                    : "";
                return "<p" + className + ">" + renderedInner + "</p>\\n";
              }
          '''
          export_text = (
              export_text[:paragraph_start]
              + paragraph_block
              + export_text[paragraph_end:]
          )

          Path("src/features/export/exportEngine.ts").write_text(
              export_text, encoding="utf-8"
          )
          export_core_path.unlink()

          extensions_core_path = Path("src/features/editor/extensionsCore.ts")
          extensions_text = extensions_core_path.read_text(encoding="utf-8")
          extensions_text = replace_once(
              extensions_text,
              '''import { InlineAtomNavigationExtension } from "@/features/editor/InlineAtomNavigationExtension";
          ''',
              '''import { InlineAtomNavigationExtension } from "@/features/editor/InlineAtomNavigationExtension";
          import { createParagraphIndentPlugin } from "@/features/editor/ParagraphIndentPlugin";
          ''',
              "editor plugin import",
          )
          extensions_text = replace_once(
              extensions_text,
              '''export const ParagraphWithEmptyLineSupport = Paragraph.extend({
            addStorage() {
          ''',
              '''export const ParagraphWithEmptyLineSupport = Paragraph.extend({
            addProseMirrorPlugins() {
              return [createParagraphIndentPlugin()];
            },

            addStorage() {
          ''',
              "paragraph extension plugin registration",
          )
          Path("src/features/editor/extensions.ts").write_text(
              extensions_text, encoding="utf-8"
          )
          extensions_core_path.unlink()

          test_path = Path("src/features/export/paragraphIndentDialogue.test.ts")
          test_text = test_path.read_text(encoding="utf-8")
          test_text = replace_once(
              test_text,
              '''function makeScene(): TreeNodeData {
            return {
              id: "scene-1",
          ''',
              '''function makeScene(
            id = "scene-1",
            sortOrder = "a0",
          ): TreeNodeData {
            return {
              id,
          ''',
              "scene fixture parameters",
          )
          test_text = replace_once(
              test_text,
              '''    sortOrder: "a0",
          ''',
              '''    sortOrder,
          ''',
              "scene fixture sort order",
          )
          test_text = replace_once(
              test_text,
              '''function settings(overrides: Partial<ExportSettings>): ExportSettings {
          ''',
              '''function generatedDocument(...paragraphs: string[]): string {
            return JSON.stringify({
              type: "doc",
              content: [
                {
                  type: "generatedProseBlock",
                  attrs: { beatId: "beat-1", modified: false },
                  content: paragraphs.map((text) => ({
                    type: "paragraph",
                    content: [{ type: "text", text }],
                  })),
                },
              ],
            });
          }

          function settings(overrides: Partial<ExportSettings>): ExportSettings {
          ''',
              "generated document helper",
          )
          test_text = replace_once(
              test_text,
              '''describe("dialogue paragraph indentation", () => {
          ''',
              '''function exportGeneratedParagraphs(
            paragraphs: string[],
            exportSettings: ExportSettings,
          ): string {
            const scene = makeScene();
            return generateExport({
              nodes: [scene],
              contentMap: { [scene.id]: generatedDocument(...paragraphs) },
              checkedIds: new Set([scene.id]),
              settings: exportSettings,
            });
          }

          describe("dialogue paragraph indentation", () => {
          ''',
              "generated export helper",
          )
          test_text = test_text.replace(
              '    expect(result).not.toContain("grimodex-dialogue-indent-exempt");\n',
              "",
          )

          generated_tests = '''
            it("applies the policy inside generated prose blocks for full-width output", () => {
              const result = exportGeneratedParagraphs(
                ["生成地の文", "「会話」", "『内声』", "　「意図的な字下げ」"],
                settings({
                  format: "plaintext",
                  paragraphIndent: "fullwidth-space",
                }),
              );

              expect(result).toBe(
                "　生成地の文\\n\\n「会話」\\n\\n『内声』\\n\\n　「意図的な字下げ」\\n",
              );
            });

            it("applies the policy inside generated prose blocks for CSS output", () => {
              const result = exportGeneratedParagraphs(
                ["生成地の文", "「会話」", "『内声』", "　「意図的な字下げ」"],
                settings({ format: "html", paragraphIndent: "css" }),
              );

              expect(result).toContain(
                '<p class="paragraph-indent">生成地の文</p>',
              );
              expect(result).toContain("<p>「会話」</p>");
              expect(result).toContain("<p>『内声』</p>");
              expect(result).toContain("<p>　「意図的な字下げ」</p>");
            });

            it("does not enumerate content for unselected scenes", () => {
              const selected = makeScene("scene-1", "a0");
              const unselected = makeScene("scene-2", "a1");
              const contentMap = new Proxy<Record<string, string>>(
                {
                  [selected.id]: document("地の文"),
                  [unselected.id]: document("「未選択の会話」"),
                },
                {
                  ownKeys() {
                    throw new Error("contentMap must not be enumerated");
                  },
                },
              );

              expect(
                generateExport({
                  nodes: [selected, unselected],
                  contentMap,
                  checkedIds: new Set([selected.id]),
                  settings: settings({
                    format: "plaintext",
                    paragraphIndent: "fullwidth-space",
                  }),
                }),
              ).toBe("　地の文\\n");
            });
          '''
          describe_end = test_text.rfind("\n});\n")
          if describe_end < 0:
              raise RuntimeError("dialogue describe terminator not found")
          test_text = (
              test_text[:describe_end]
              + generated_tests
              + test_text[describe_end:]
          )
          test_path.write_text(test_text, encoding="utf-8")

          Path(".github/workflows/apply-pr474-review-fix.yml").unlink()
          PY

      - name: Commit review fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add -A
          git commit -m "fix: apply paragraph indent policy during rendering"
          git push origin "HEAD:agent/dialogue-paragraph-indent"
