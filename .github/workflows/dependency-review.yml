name: Dependency Review

on:
  # Automatic dependency review is paused while this source repository is
  # private. Run it manually when a dependency change needs review.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event.pull_request.head.repo.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
