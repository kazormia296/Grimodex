name: Format PR 471 multipass files

on:
  push:
    branches:
      - agent/zen-gpu-glass-pipeline-final

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed multipass files
        run: >-
          pnpm exec prettier --write
          src/features/editor/zen/ZenMultipassCanvas.tsx
          src/features/editor/zen/ZenShaderSurface.tsx
          src/features/editor/zen/zenMultipassPipeline.ts
          src/features/editor/zen/zenMultipassPipeline.test.ts
      - name: Remove temporary workflow and commit formatting
        run: |
          rm .github/workflows/format-pr471.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/format-pr471.yml \
            src/features/editor/zen/ZenMultipassCanvas.tsx \
            src/features/editor/zen/ZenShaderSurface.tsx \
            src/features/editor/zen/zenMultipassPipeline.ts \
            src/features/editor/zen/zenMultipassPipeline.test.ts
          git commit -m "style(editor): format multipass regression fix"
          git push origin HEAD:${{ github.ref_name }}
