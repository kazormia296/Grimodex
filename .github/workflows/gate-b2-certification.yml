name: Gate B2 Certification
run-name: Gate B2 candidate ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Frozen candidate commit SHA
        required: true
        type: string
      freeze_sha:
        description: Metadata-only freeze envelope commit whose parent is the candidate
        required: true
        type: string
      full_ci_run_id:
        description: Successful CI workflow_dispatch run ID for the same candidate
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  certify:
    name: Gate B2 first attempt
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GATE_B2_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      GATE_B2_FREEZE_SHA: ${{ inputs.freeze_sha }}
      GATE_B2_FULL_CI_RUN_ID: ${{ inputs.full_ci_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.freeze_sha }}

      - name: Verify immutable candidate freeze envelope
        shell: bash
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'
          [[ "$GATE_B2_CANDIDATE_SHA" =~ $sha_pattern ]]
          [[ "$GATE_B2_FREEZE_SHA" =~ $sha_pattern ]]

          test "$(git rev-parse HEAD)" = "$GATE_B2_FREEZE_SHA"
          test "$(git rev-parse "${GATE_B2_FREEZE_SHA}^")" = "$GATE_B2_CANDIDATE_SHA"

          active_freeze='evals/certifications/gate-b2-candidate.freeze.json'
          candidate_result="evals/certifications/results/gate-b2-${GATE_B2_CANDIDATE_SHA}.json"
          archive_pattern='^evals/certifications/archive/gate-b2-candidate\.[0-9a-f]{40}\.freeze\.json$'
          saw_active=0
          saw_result=0
          saw_archive=0
          change_count=0
          while IFS=$'\t' read -r status changed_path; do
            change_count=$((change_count + 1))
            if [[ "$status" = 'M' && "$changed_path" = "$active_freeze" ]]; then
              saw_active=1
            elif [[ "$status" = 'A' && "$changed_path" = "$candidate_result" ]]; then
              saw_result=1
            elif [[ "$status" = 'A' && "$changed_path" =~ $archive_pattern ]]; then
              saw_archive=1
            else
              echo "Unexpected freeze-envelope change: ${status} ${changed_path}" >&2
              exit 1
            fi
          done < <(git diff --name-status "$GATE_B2_CANDIDATE_SHA" "$GATE_B2_FREEZE_SHA")
          test "$change_count" -eq 3
          test "$saw_active" -eq 1
          test "$saw_result" -eq 1
          test "$saw_archive" -eq 1

          candidate_tree="$(git rev-parse "${GATE_B2_CANDIDATE_SHA}^{tree}")"
          GATE_B2_CANDIDATE_TREE_SHA="$candidate_tree" node <<'NODE'
          const fs = require("node:fs");
          const candidate = process.env.GATE_B2_CANDIDATE_SHA;
          const tree = process.env.GATE_B2_CANDIDATE_TREE_SHA;
          const freeze = JSON.parse(fs.readFileSync(
            "evals/certifications/gate-b2-candidate.freeze.json",
            "utf8",
          ));
          const result = JSON.parse(fs.readFileSync(
            `evals/certifications/results/gate-b2-${candidate}.json`,
            "utf8",
          ));
          if (
            freeze.status === "superseded" ||
            freeze.candidateCommitSha !== candidate ||
            freeze.candidateTreeSha !== tree ||
            freeze.candidate?.commitSha !== candidate ||
            freeze.candidate?.treeSha !== tree
          ) {
            throw new Error("active Gate B2 freeze does not match candidate identity");
          }
          if (
            result.verdict !== "INCOMPLETE" ||
            result.freezeId !== freeze.freezeId ||
            result.candidateCommitSha !== candidate ||
            result.candidateTreeSha !== tree
          ) {
            throw new Error("provisional Gate B2 result does not match active freeze");
          }
          NODE

      - name: Reject duplicate dispatches and reruns
        run: node scripts/quality/gate-b2-github-attempt.mjs --candidate "$GATE_B2_CANDIDATE_SHA"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          # Keep dependency caching disabled: freeze_sha is a dispatch input in
          # the default-branch cache scope.

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - run: pnpm install --frozen-lockfile

      - name: Bind successful Full CI evidence
        run: |
          node scripts/quality/write-gate-b2-full-ci-evidence.mjs \
            --candidate "$GATE_B2_CANDIDATE_SHA" \
            --run-id "$GATE_B2_FULL_CI_RUN_ID" \
            --output ".artifacts/gate-b2/$GATE_B2_CANDIDATE_SHA/light/full-ci.json"

      - name: Build shared workspace dependencies
        run: pnpm build:workspace:dependencies

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run credential-free Gate B2 engineering suites
        run: |
          pnpm certify:gate-b2 -- \
            --run-light \
            --run-heavy \
            --run-journeys \
            --candidate "$GATE_B2_CANDIDATE_SHA" \
            --ci-evidence ".artifacts/gate-b2/$GATE_B2_CANDIDATE_SHA/light/full-ci.json" \
            --report ".artifacts/gate-b2/$GATE_B2_CANDIDATE_SHA/report.json"

      - name: Upload Gate B2 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-b2-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/gate-b2
          if-no-files-found: warn
          retention-days: 90
