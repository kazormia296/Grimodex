name: Browser performance benchmark

on:
  pull_request:
    paths:
      - .github/workflows/browser-performance-benchmark.yml
      - .github/workflows/ci.yml
      - package.json
      - scripts/browser-ci-benchmark.mjs

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark (${{ matrix.case }} / run ${{ matrix.repeat }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        repeat: [1, 2, 3]
        case:
          - browser-auto
          - browser-workers-1
          - browser-workers-2
          - browser-workers-3
          - browser-workers-4
          - browser-shard-1-2
          - browser-shard-2-2
          - storybook-auto
          - storybook-workers-1
          - storybook-workers-2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Scan workspace dependencies
        run: pnpm build:scan:dependencies

      - name: Chromium binary cache
        id: pw-cache
        uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-chromium

      - name: Install Playwright Chromium and system dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Measure Browser automatic workers
        if: matrix.case == 'browser-auto'
        run: pnpm benchmark:browser-ci -- --suite browser --runs 1 --candidate browser-auto --output .artifacts/browser-ci/benchmark.json

      - name: Measure Browser with one worker
        if: matrix.case == 'browser-workers-1'
        run: pnpm benchmark:browser-ci -- --suite browser --runs 1 --candidate browser-workers-1 --max-workers 1 --output .artifacts/browser-ci/benchmark.json

      - name: Measure Browser with two workers
        if: matrix.case == 'browser-workers-2'
        run: pnpm benchmark:browser-ci -- --suite browser --runs 1 --candidate browser-workers-2 --max-workers 2 --output .artifacts/browser-ci/benchmark.json

      - name: Measure Browser with three workers
        if: matrix.case == 'browser-workers-3'
        run: pnpm benchmark:browser-ci -- --suite browser --runs 1 --candidate browser-workers-3 --max-workers 3 --output .artifacts/browser-ci/benchmark.json

      - name: Measure Browser with four workers
        if: matrix.case == 'browser-workers-4'
        run: pnpm benchmark:browser-ci -- --suite browser --runs 1 --candidate browser-workers-4 --max-workers 4 --output .artifacts/browser-ci/benchmark.json

      - name: Measure Browser shard one of two
        if: matrix.case == 'browser-shard-1-2'
        run: pnpm benchmark:browser-ci -- --suite browser --runs 1 --candidate browser-shard-1-2 --shard 1/2 --output .artifacts/browser-ci/benchmark.json

      - name: Measure Browser shard two of two
        if: matrix.case == 'browser-shard-2-2'
        run: pnpm benchmark:browser-ci -- --suite browser --runs 1 --candidate browser-shard-2-2 --shard 2/2 --output .artifacts/browser-ci/benchmark.json

      - name: Measure Storybook automatic workers
        if: matrix.case == 'storybook-auto'
        run: pnpm benchmark:browser-ci -- --suite storybook --runs 1 --candidate storybook-auto --output .artifacts/browser-ci/benchmark.json

      - name: Measure Storybook with one worker
        if: matrix.case == 'storybook-workers-1'
        run: pnpm benchmark:browser-ci -- --suite storybook --runs 1 --candidate storybook-workers-1 --max-workers 1 --output .artifacts/browser-ci/benchmark.json

      - name: Measure Storybook with two workers
        if: matrix.case == 'storybook-workers-2'
        run: pnpm benchmark:browser-ci -- --suite storybook --runs 1 --candidate storybook-workers-2 --max-workers 2 --output .artifacts/browser-ci/benchmark.json

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-benchmark-${{ matrix.case }}-${{ matrix.repeat }}
          path: .artifacts/browser-ci/benchmark.json
          if-no-files-found: error
          retention-days: 14
