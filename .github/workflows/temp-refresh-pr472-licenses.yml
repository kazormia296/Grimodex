name: Temporary refresh PR472 licenses

on:
  push:
    branches:
      - agent/export-paragraph-indent
    paths:
      - .github/workflows/temp-refresh-pr472-licenses.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/export-paragraph-indent
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate third-party licenses
        run: pnpm generate:licenses

      - name: Validate generated copies
        shell: bash
        run: |
          set -euo pipefail
          cmp THIRD_PARTY_LICENSES.md public/THIRD_PARTY_LICENSES.md
          grep -q '^### js-yaml (4\.3\.1)$' THIRD_PARTY_LICENSES.md
          if grep -q '^### js-yaml (4\.3\.0)$' THIRD_PARTY_LICENSES.md; then
            echo 'stale js-yaml 4.3.0 license entry remains' >&2
            exit 1
          fi
          git diff --check

      - name: Commit refreshed licenses
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add THIRD_PARTY_LICENSES.md public/THIRD_PARTY_LICENSES.md
          git diff --cached --quiet && {
            echo 'license files did not change' >&2
            exit 1
          }
          git commit -m "chore(licenses): refresh generated licenses"
          git push origin HEAD:agent/export-paragraph-indent
