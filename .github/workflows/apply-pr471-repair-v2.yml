name: Apply PR471 repair bundle v2

on:
  push:
    branches:
      - agent/zen-gpu-glass-pipeline-final

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-pr471-repair-v2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zen-gpu-glass-pipeline-final
          fetch-depth: 0

      - name: Build and publish repaired history
        shell: bash
        run: |
          set -euo pipefail
          staged_head="$(git rev-parse HEAD)"
          branch="agent/zen-gpu-glass-pipeline-final"
          surface_test="src/features/editor/zen/ZenShaderSurface.test.tsx"

          gzip -dc .github/pr471/fix-pr471-live-updates.patch.gz > /tmp/live.patch
          gzip -dc .github/pr471/pr471-final-visible-color-fix.patch.gz > /tmp/final.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --detach b8eea3a529f8c0a612035a9ae53f305e0dde2a3b
          git apply --check --recount --exclude="$surface_test" /tmp/live.patch
          git apply --recount --exclude="$surface_test" /tmp/live.patch

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/features/editor/zen/ZenShaderSurface.test.tsx")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected source count for {old[:70]!r}")
              text = text.replace(old, new, 1)

          def replace_section(start_marker: str, end_marker: str, transform):
              global text
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              section = text[start:end]
              updated = transform(section)
              if updated == section:
                  raise SystemExit(f"section did not change: {start_marker}")
              text = text[:start] + updated + text[end:]

          replace_once(
              '  animation: [] as Array<{ playing: boolean; speed: number }>,\n',
              '',
          )
          start = text.index('vi.mock("./zenShaderAnimation"')
          end = text.index('vi.mock("@paper-design/shaders-react"', start)
          text = text[:start] + text[end:]

          mock_start = text.index('vi.mock("@paper-design/shaders-react"')
          mock_end = text.index('vi.mock("./zenThemePalette"', mock_start)
          mock = r'''vi.mock("./ZenMultipassCanvas", () => ({
            ZenMultipassCanvas: forwardRef<
              PaperShaderElement,
              {
                "data-paper-shader": string;
                maxPixelCount: number;
                speed: number;
                minPixelRatio: number;
                webGlContextAttributes?: WebGLContextAttributes;
                compositeFragment: string;
                compositeUniforms: Record<string, unknown>;
              }
            >(function MockZenMultipassCanvas(
              {
                "data-paper-shader": shader,
                maxPixelCount,
                speed,
                minPixelRatio,
                webGlContextAttributes,
                compositeFragment,
                compositeUniforms,
              },
              forwardedRef,
            ) {
              const elementRef = useRef<HTMLDivElement>(null);
              const mountedShader = useRef(shader).current;
              const mountedCapacity = useRef(
                Number(
                  /u_zenUiSurfaceRects\[(\d+)\]/.exec(compositeFragment)?.[1] ?? 0,
                ),
              ).current;
              const mountedUniformLength = useRef(
                compositeUniforms["u_zenUiSurfaceRects[0]"] instanceof Float32Array
                  ? compositeUniforms["u_zenUiSurfaceRects[0]"].length
                  : 0,
              ).current;
              shaderLifecycle.props.push({ maxPixelCount, speed });
              shaderLifecycle.antiAliasing.push({
                minPixelRatio,
                antialias: webGlContextAttributes?.antialias ?? false,
              });
              useImperativeHandle(forwardedRef, () => {
                const element = elementRef.current as unknown as PaperShaderElement;
                element.paperShaderMount = {
                  getPerformanceStats: () => ({
                    drawCount: shaderLifecycle.drawCount,
                    gpuTimeMs: null,
                    isStaticFrameReady: shaderLifecycle.staticFrameReady,
                  }),
                } as NonNullable<PaperShaderElement["paperShaderMount"]>;
                return element;
              }, []);

              useEffect(() => {
                shaderLifecycle.mounted.push(mountedShader);
                shaderLifecycle.mountedCapacities.push(mountedCapacity);
                shaderLifecycle.mountedUniformLengths.push(mountedUniformLength);
                return () => {
                  shaderLifecycle.unmounted.push(mountedShader);
                  shaderLifecycle.unmountedCapacities.push(mountedCapacity);
                };
              }, [mountedCapacity, mountedShader, mountedUniformLength]);

              return <div ref={elementRef} data-paper-shader={shader} />;
            }),
          }));

          '''
          text = text[:mock_start] + mock + text[mock_end:]
          replace_once('    shaderLifecycle.animation.length = 0;\n', '')

          def full_hd(section: str) -> str:
              section = section.replace(
                  '      speed: 0,\n',
                  '      speed: ZEN_SHADER_DEFAULTS.speed / 100,\n',
                  1,
              )
              section, count = re.subn(
                  r'\n    await waitFor\(\(\) =>\n      expect\(shaderLifecycle\.animation\.at\(-1\)\)\.toMatchObject\(\{\n        playing: true,\n        speed: ZEN_SHADER_DEFAULTS\.speed / 100,\n      \}\),\n    \);\n',
                  '\n',
                  section,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("animated scheduler assertion not found")
              section, count = re.subn(
                  r'\n    expect\(shaderLifecycle\.animation\.at\(-1\)\)\.toMatchObject\(\{\n      playing: false,\n    \}\);\n',
                  '\n',
                  section,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("static scheduler assertion not found")
              return section

          replace_section(
              '  it("uses one native pixel per CSS pixel up to Full HD"',
              '  it("uses the shader\'s analytic antialiasing',
              full_hd,
          )

          def active_speed(section: str) -> str:
              if section.count('      speed: 0,\n') != 1:
                  raise SystemExit("unexpected speed assertion count")
              return section.replace(
                  '      speed: 0,\n',
                  '      speed: ZEN_SHADER_DEFAULTS.speed / 100,\n',
                  1,
              )

          replace_section(
              '  it("uses the shader\'s analytic antialiasing',
              '  it("keeps previews at the smaller pixel budget"',
              active_speed,
          )
          replace_section(
              '  it("keeps previews at the smaller pixel budget"',
              '  it("uses the static fallback',
              active_speed,
          )

          path.write_text(text)
          PY

          git add -A
          git commit -m "fix(editor): make multipass updates renderer-owned"
          live_commit="$(git rev-parse HEAD)"

          git checkout --detach d14759afdd63bf403ea6987fe2764b592e7fcb82
          git apply --check --recount /tmp/final.patch
          git apply --recount /tmp/final.patch
          git add -A
          git commit -m "fix(editor): preserve visible motion through final contrast"
          final_commit="$(git rev-parse HEAD)"

          git checkout -B "$branch" "$live_commit"
          git merge --no-ff -X ours "$final_commit" \
            -m "fix(editor): restore visible live multipass updates"
          git show --check --oneline --stat HEAD
          test ! -e .github/pr471
          test ! -e .github/workflows/apply-pr471-repair.yml
          test ! -e .github/workflows/apply-pr471-repair-v2.yml

          git push \
            --force-with-lease="refs/heads/$branch:$staged_head" \
            origin "HEAD:refs/heads/$branch"
