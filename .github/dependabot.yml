version: 2
updates:
  # npm (frontend)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      tauri:
        patterns:
          - "@tauri-apps/*"
      tiptap:
        patterns:
          - "@tiptap/*"
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Cargo (Rust)
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"

  # uv (offline LFM evaluation harness; security updates only)
  - package-ecosystem: "uv"
    directory: "/experiments/lfm25-encoder-phase0"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
