[workspace]
members = ["crates/grimodex-mcp", "crates/grimodex-lint"]

[package]
name = "grimodex"
version = "0.3.0-beta.1"
description = "A Tauri App"
authors = ["you"]
license = "Elastic-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "grimodex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.39", features = ["bundled"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
keyring = { version = "3", features = ["sync-secret-service", "windows-native", "apple-native"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
futures = "0.3"
tokio = { version = "1", features = ["macros", "process", "io-util", "rt", "sync", "time"] }
aho-corasick = "1"
grimodex-lint = { path = "crates/grimodex-lint" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
