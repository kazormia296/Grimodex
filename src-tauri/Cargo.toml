[workspace]
members = ["crates/grimodex-mcp", "crates/grimodex-lint"]

[package]
name = "grimodex"
version = "0.4.3"
description = "A Tauri App"
authors = ["you"]
license = "Elastic-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "grimodex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["semantic-embedding"]
devtools = ["tauri/devtools"]
# 本文セマンティック検索の ONNX 推論経路 (Step 4 以降)。production ビルドでは default 有効。
# `cargo test --no-default-features` で off にすれば chunker などの pure-logic テストが
# onnxruntime バイナリ無しで走る (Tauri ビルド時に download-binaries が dl)。
semantic-embedding = ["dep:ort", "dep:tokenizers", "dep:ndarray"]

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.39", features = ["bundled"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
notify = "6"
chrono = "0.4"
keyring = { version = "3", features = ["sync-secret-service", "windows-native", "apple-native"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
futures = "0.3"
tokio = { version = "1", features = ["macros", "process", "io-util", "rt", "sync", "time"] }
aho-corasick = "1"
grimodex-lint = { path = "crates/grimodex-lint" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "5"
# 本文セマンティック検索 (temp/semantic-prose-search-context.md §2.3)。
# ort: ONNX Runtime バインディング。download-binaries で初回ビルド時に prebuilt ORT を取得する。
# tokenizers: HuggingFace tokenizers (ruri-v3 ONNX に同梱の tokenizer.json をロード)。
# ndarray: ONNX 入出力テンソルの構築・mean pooling 演算に使用。
ort = { version = "2.0.0-rc.10", optional = true, default-features = false, features = [
    "download-binaries",
    "std",
    "ndarray",
    # download-binaries は build-time に prebuilt ORT を取りに行く。TLS feature を選ばないと
    # ort-sys のビルドが落ちる。rustls は pure-Rust で system OpenSSL に依存しないため Tauri
    # 配布物との相性が良い。
    "tls-rustls",
] }
# fancy-regex を選ぶと pure-Rust のまま Oniguruma を避けられる。ruri-v3 の tokenizer.json は BPE 系。
tokenizers = { version = "0.21", optional = true, default-features = false, features = [
    "fancy-regex",
] }
ndarray = { version = "0.17", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
