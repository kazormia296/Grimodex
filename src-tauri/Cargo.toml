[workspace]
members = [
    "crates/grimodex-core",
    "crates/grimodex-db",
    "crates/grimodex-fonts",
    "crates/grimodex-mcp",
    "crates/grimodex-lint",
    "crates/grimodex-ai",
    "crates/grimodex-post-effect",
    "crates/grimodex-license",
    "crates/grimodex-semantic",
]

[package]
name = "grimodex"
version = "1.0.0"
description = "Grimodex - Writing Fidget IDE (Tauri + React)"
authors = ["kazormia296 <kazormia296@users.noreply.github.com>"]
license = "Elastic-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "grimodex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["semantic-embedding"]
devtools = ["tauri/devtools"]
# 本文セマンティック検索の ONNX 推論経路 (Step 4 以降)。production ビルドでは default 有効。
# `cargo test --no-default-features` で off にすれば chunker などの pure-logic テストが
# onnxruntime バイナリ無しで走る (Tauri ビルド時に download-binaries が dl)。
semantic-embedding = ["grimodex-semantic/semantic-embedding"]
# ライセンス認証機構 (ライセンス認証設計書 §9.1)。ベータ配布ビルドでは無効のまま
# (= 全ゲート素通り・License UI 非表示)。1.0 リリースビルドのみ --features licensing。
# 無効でもコマンドは登録され、get_license_state が licensing_enabled:false を返す。
licensing = ["grimodex-license/licensing", "grimodex-mcp/licensing"]

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
# アプリ自動更新 (Track2 updater 導入)。licensing / semantic feature とは独立の
# 無条件依存。updater は署名付き latest.json を GitHub Releases から取得し、
# process は更新後の再起動 (relaunch) に使う。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 校閲 run 完了/失敗のデスクトップ通知 (ウィンドウ非フォーカス時のみ FE が送る)
tauri-plugin-notification = "2"
window-vibrancy = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
hex = "0.4"
notify = "8"
chrono = "0.4"
# バックアップの gzip 圧縮 (backup restore Phase 2)。Cargo.lock に ort/tauri
# bundler 経由で既に取り込まれているため直接依存化のコストはほぼゼロ。
flate2 = "1"
# keyring は crates/grimodex-ai へ移設（Electron 移行 Phase 3 バッチ3a）。
# API キー保管は grimodex-ai の keyring feature 経由で有効化する（下記依存）。
reqwest = { version = "0.13", features = ["json", "stream"] }
futures = "0.3"
tokio = { version = "1", features = ["macros", "process", "io-util", "rt", "sync", "time"] }
# システムフォント列挙 (commands::fonts::list_system_fonts)。実装本体は
# crates/grimodex-fonts へ抽出済み (Electron 移行 Phase 3 — napi と共用)。
grimodex-fonts = { path = "crates/grimodex-fonts" }
grimodex-lint = { path = "crates/grimodex-lint" }
grimodex-core = { path = "crates/grimodex-core" }
# AI プロバイダ層 (HTTP/SSE/provider/型) を抽出 (Electron 移行 Phase 3 バッチ3a —
# napi と共用)。`crate::ai::*` は re-export shim 経由でこのクレートへ委譲し、
# ai_responses / ai_novelist はクレート内部モジュールとして閉じる。keyring feature で
# OS セキュアストレージ経路 (save/has/delete_api_key) を Tauri ビルドのみ有効化する。
grimodex-ai = { path = "crates/grimodex-ai", features = ["keyring"] }
grimodex-post-effect = { path = "crates/grimodex-post-effect" }
grimodex-license = { path = "crates/grimodex-license" }
grimodex-semantic = { path = "crates/grimodex-semantic", default-features = false }
# DB 層 (Electron 移行 Phase 2 S1 で抽出)。`crate::database` / `crate::workspace`
# は lib.rs の互換シム経由でこのクレートへ委譲する。
grimodex-db = { path = "crates/grimodex-db" }
# MCP サーバを本体バイナリに統一する (src/main.rs の `mcp` サブコマンド分岐から
# run_blocking を呼ぶ)。一方向依存・循環なし: grimodex-mcp は grimodex-core のみ
# に依存し src-tauri を参照しない。grimodex_lib 側へ import しないこと。
grimodex-mcp = { path = "crates/grimodex-mcp" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "6"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# WebKitGTK の機能フラグ操作 (webkit_features.rs)。wry が同じ crate を使うため
# 新規のネイティブ依存は増えない。feature API (2.42+) 自体は未バインドで dlsym
# 解決する — ここでは WebView/Settings 型と terminate_web_process/reload の
# バインディングだけを使う。
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }
glib = "0.18"
