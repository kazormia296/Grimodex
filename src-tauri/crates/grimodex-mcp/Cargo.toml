[package]
name = "grimodex-mcp"
version = "0.1.0"
edition = "2021"
license-file.workspace = true
publish.workspace = true

[lib]
name = "grimodex_mcp"
path = "src/lib.rs"

[[bin]]
name = "grimodex-mcp"
path = "src/main.rs"

[features]
# ライセンスゲート (ライセンス認証設計書 §9.1)。ルート crate の licensing
# feature から伝搬される。無効 (ベータ) では write ツールのゲートが素通り。
licensing = []

[dependencies]
grimodex-core = { path = "../grimodex-core" }
grimodex-db = { path = "../grimodex-db" }
rmcp = { version = "2.1", features = ["server", "transport-io", "macros"] }
schemars = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "6"
chrono = "0.4"
