[package]
name = "grimodex-post-effect"
version = "0.1.0"
edition = "2021"
license = "Elastic-2.0"
description = "Shared post-effect orchestration for the Tauri and Electron backends"

[dependencies]
anyhow = "1"
hex = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

grimodex-ai = { path = "../grimodex-ai" }
grimodex-db = { path = "../grimodex-db" }
grimodex-lint = { path = "../grimodex-lint" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
