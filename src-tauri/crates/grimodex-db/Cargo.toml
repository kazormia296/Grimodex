[package]
name = "grimodex-db"
version = "0.1.0"
edition = "2021"
license = "Elastic-2.0"
description = "Grimodex workspace DB layer shared by the Electron N-API backend, MCP server, and frozen Tauri compatibility shell"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
hex = "0.4"
flate2 = "1"
base64 = "0.22"
tracing = "0.1"
anyhow = "1"
thiserror = "2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
grimodex-core = { path = "../grimodex-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
