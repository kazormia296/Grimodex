[package]
name = "grimodex-lint"
version = "0.1.0"
edition = "2021"
license = "Elastic-2.0"
description = "Grimodex deterministic text linter core"

[lib]
name = "grimodex_lint"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = "2"
regex = "1"
tracing = "0.1"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
