# AI プロバイダ層（HTTP / SSE ストリーミング / provider 分岐 / 型定義）を
# Tauri コマンド層と napi バックエンドで共用するためのクレート
# （Electron 移行 Phase 3 バッチ3a）。
#
# - **tauri 非依存**: ストリーミングの emit は `emit::StreamEmitter` trait 越し。
#   Tauri 側は AppHandle アダプタ、napi 側は EventQueue がこの trait を実装する。
# - **keyring は optional feature**: Tauri ビルドのみ `features = ["keyring"]` で
#   OS セキュアストレージ経路を有効化する。napi（Electron）側は safeStorage を
#   main プロセスで使うため keyring を link しない（Phase 3 バッチ3 のキー保管方針）。
[package]
name = "grimodex-ai"
version = "0.1.0"
edition = "2021"
license-file.workspace = true
publish.workspace = true
description = "AI provider layer (HTTP/SSE streaming, provider dispatch, types) shared by the Tauri command layer and the napi backend"

[dependencies]
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["time", "macros"] }
tracing = "0.1"
keyring = { version = "3", features = [
    "sync-secret-service",
    "windows-native",
    "apple-native",
], optional = true }

[features]
# OS セキュアストレージ経由の API キー保管（save/get/delete_api_key + keyring_user*）。
# Tauri ビルドが有効化する。napi ビルドは無効のまま（safeStorage を使う）。
keyring = ["dep:keyring"]

[dev-dependencies]
tokio = { version = "1", features = ["time", "rt", "macros", "net", "io-util"] }
# Electron addon (grimodex-node) の build では、他の crate 経由で serde_json の
# preserve_order と float_roundtrip が有効になる（`cargo tree -e features` で確認）。
# 単体の `cargo test -p grimodex-ai` でも同じ条件にして、wire body の key 順・数値表現を
# addon の送信と揃える（src/mastra_wire_parity_tests.rs）。製品の依存は変えない。
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
