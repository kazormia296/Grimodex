[package]
name = "grimodex-core"
version = "0.1.0"
edition = "2021"
description = "Shared Grimodex write primitives (change_events, policy, undo-journal)"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
