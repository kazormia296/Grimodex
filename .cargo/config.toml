# ローカルビルドの設定。cargo は manifest ではなく **カレントディレクトリの祖先**
# から config を探すため、リポジトリ直下に置くことで
# `cargo --manifest-path src-tauri/Cargo.toml ...`（CLAUDE.md の記載どおりの
# 呼び方）と `cd src-tauri && cargo ...` の両方に効く。
# electron/native/grimodex-node のビルドにも同じ設定が乗る。

# CI は `CARGO_PROFILE_TEST_DEBUG: "0"` / `CARGO_PROFILE_DEV_DEBUG: "0"` を
# ジョブごとに明示指定している（.github/workflows/ci.yml）。ローカルだけ
# フル debuginfo が付いたままだったので、CI と同じ扱いに揃える。
#
# grimodex-db は単一 crate に narrative_extraction だけで 1.3MB 超あり、
# テストバイナリのリンクが直列かつ I/O 律速になる。実測（4コア環境、
# 1ファイル変更 → `cargo test -p grimodex-db --lib --no-run`）:
#   debuginfo あり: 38.3s（うち CPU 19.4s。差の約19秒はリンク待ち）
#   debuginfo なし:  6.4s（CPU  6.6s。ほぼ待ちなし）
# 7.1GB まで膨らんでいた target ディレクトリも縮む。
#
# バックトレースの行番号が要る場合は各自 `debug = "line-tables-only"` に
# 上げるか、その回だけ `CARGO_PROFILE_TEST_DEBUG=1` を付ける。
[profile.dev]
debug = 0

[profile.test]
debug = 0

# リンカは既定のまま。`-fuse-ld=lld` も試したが 7.4s で、既定リンカの
# 6.4s より速くならなかった。上記の短縮は debuginfo の削減だけで説明でき、
# リンカ変更の寄与は測定できていない。`lld` は scripts/bootstrap-build-env.sh
# にも .devcontainer にも宣言が無く、強制すると持たない環境が壊れるだけなので
# 入れない。
