# cargo audit exceptions. None are in force: an exception needs its own scope,
# reason and expiry, and asserted by scripts/release-workflows.test.mjs
# ("keeps the Rust audit exception list empty ...").
#
# RUSTSEC-2026-0459 / CVE-2026-119375 (libsqlite3-sys 0.38.1 bundled SQLite
# < 3.54.0: a process that opens a database file together with a sibling -wal
# file whose page size differs from the database's can read uninitialized
# page-cache memory) was excepted until rusqlite 0.41 (libsqlite3-sys 0.39.1,
# bundled SQLite 3.54.1) was locked in both Cargo.lock files (DR-DBC-4,
# docs/plans/nir1-lane-decisions/db-connection-decisions.md).
[advisories]
ignore = []
