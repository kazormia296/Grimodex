# cargo audit exceptions. Each exception is scoped, expires, and is asserted by
# scripts/release-workflows.test.mjs ("scopes the Rust audit exception").
#
# 現在、有効な例外は無い。以前の zip 4.6.1（RUSTSEC-2026-0367〜0369）は、
# frozen legacy の Tauri shell の tauri-plugin-updater の `zip` feature を外して
# 依存ごと解消した（src-tauri/Cargo.toml を参照）。
# 例外を追加するときは、対象・理由・期限（expires-at）を必ずここに書き、
# scripts/release-workflows.test.mjs の期待値も合わせる。
[advisories]
ignore = []
