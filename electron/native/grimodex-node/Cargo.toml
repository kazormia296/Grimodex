# Electron 移行 Phase 2 S2 (設計書 §4.2): grimodex-db を Node ネイティブ
# モジュールとして公開する napi クレート。
#
# - rusqlite / libsqlite3-sys は grimodex-db 経由でのみ引く (直依存禁止 —
#   「バージョン一致必須」問題を構造的に消す。設計書 §4.2)。
# - Cargo.lock は src-tauri と本クレートの 2 本になる。rusqlite のバージョン
#   文字列は src-tauri 側と一致させること (乖離検知は Phase 3 の CI で追加)。
[package]
name = "grimodex-node"
version = "0.1.0"
edition = "2021"
license = "Elastic-2.0"
description = "Grimodex native backend for the Electron shell (napi-rs bindings over grimodex-db)"

# 空 workspace: src-tauri workspace へ吸収させない (Phase 0 スパイク実証)
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# async = tokio_rt。同期 #[napi] は Node main thread = Electron main プロセス
# 全体をブロックするため、全公開関数を async + spawn_blocking にする (§4.2)。
# serde-json: #[napi] シグネチャで serde_json::Value を受けるために必要。
napi = { version = "2", default-features = false, features = ["napi8", "async", "serde-json"] }
napi-derive = "2"
grimodex-core = { path = "../../../src-tauri/crates/grimodex-core" }
grimodex-db = { path = "../../../src-tauri/crates/grimodex-db" }
serde = "1"
serde_json = "1"
anyhow = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
strip = "symbols"
