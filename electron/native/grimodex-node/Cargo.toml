# Electron 移行 Phase 2 S2 (設計書 §4.2): grimodex-db を Node ネイティブ
# モジュールとして公開する napi クレート。
#
# - rusqlite / libsqlite3-sys は grimodex-db 経由でのみ引く (直依存禁止 —
#   「バージョン一致必須」問題を構造的に消す。設計書 §4.2)。
# - Cargo.lock は src-tauri と本クレートの 2 本になる。rusqlite のバージョン
#   文字列は src-tauri 側と一致させること (乖離検知は Phase 3 の CI で追加)。
[package]
name = "grimodex-node"
version = "0.1.0"
edition = "2021"
license = "Elastic-2.0"
description = "Grimodex native backend for the Electron shell (napi-rs bindings over grimodex-db)"

[features]
default = []
# 1.0 release builds opt in explicitly. Development/beta builds keep the
# methods exported but return the exact disabled contract without touching disk.
licensing = ["grimodex-license/licensing"]

# 空 workspace: src-tauri workspace へ吸収させない (Phase 0 スパイク実証)
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# async = tokio_rt。同期 #[napi] は Node main thread = Electron main プロセス
# 全体をブロックするため、全公開関数を async + spawn_blocking にする (§4.2)。
# serde-json: #[napi] シグネチャで serde_json::Value を受けるために必要。
napi = { version = "2", default-features = false, features = ["napi8", "async", "serde-json"] }
napi-derive = "2"
grimodex-core = { path = "../../../src-tauri/crates/grimodex-core" }
grimodex-db = { path = "../../../src-tauri/crates/grimodex-db" }
# lint_text / segment_bunsetsu (Phase 3)。embed-unidic により .node が
# +200MB 級になる — Tauri バイナリと同じトレードオフ (実測は Phase 3 記録)。
grimodex-lint = { path = "../../../src-tauri/crates/grimodex-lint" }
# Phase 3 Batch 4: extract_codex_candidates + semantic 19 commandsを共有runtimeへ
# 接続する。通常Electron buildでもORT/tokenizersを有効にし、モデル欠落時だけ
# semantic invokeを明示エラーへ落とす（Backend全体はfail-soft起動）。
grimodex-semantic = { path = "../../../src-tauri/crates/grimodex-semantic", default-features = false, features = ["semantic-embedding"] }
# list_system_fonts (Phase 3 — 日本語 family 名優先ロジックの完全パリティ)。
grimodex-fonts = { path = "../../../src-tauri/crates/grimodex-fonts" }
# AI プロバイダ層 (HTTP/SSE/provider/型) を Tauri と共用 (Phase 3 バッチ3a)。
# **keyring feature は付けない** — Electron 側 API キー保管は main プロセスの
# safeStorage を使うため keyring ネイティブ依存を .node に link しない。キー解決済みの
# 平文キーを send_chat_message* へ注入し、build_chat_params に渡す。
grimodex-ai = { path = "../../../src-tauri/crates/grimodex-ai" }
# PostEffect の parser/annotation/runner 本体。Tauri と同じ crate を呼び、
# Electron 側には AppState/EventQueue/safeStorage snapshot の adapter だけを置く。
grimodex-post-effect = { path = "../../../src-tauri/crates/grimodex-post-effect" }
grimodex-license = { path = "../../../src-tauri/crates/grimodex-license" }
serde = "1"
serde_json = "1"
anyhow = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
strip = "symbols"
