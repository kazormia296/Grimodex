    <title>Grimodex</title>
    <style>
      /* JS 評価前に表示する初期スプラッシュ。React の createRoot が #root に
         マウントすると中身が置き換わって自動的に消える。色は .grimodex-boot
         スコープのみに閉じ込め、本体起動後の theme トークン（bg-background 等）を
         素の <style> で上書きしないようにする。 */
      .grimodex-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #09090b;
        color: #e4e4e7;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      @media (prefers-color-scheme: light) {
        .grimodex-boot {
          background: #fafafa;
          color: #18181b;
        }
      }
      .grimodex-boot svg {
        animation: grimodex-boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes grimodex-boot-pulse {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .grimodex-boot svg {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
