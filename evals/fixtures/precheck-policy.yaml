cases:
  - id: eval-precheck-knowledge-policy
    suiteId: tool-policy
    requirementIds: [GDX-PRECHECK-001, GDX-POLICY-001]
    fixture:
      runId: precheck-knowledge-policy
      locale: ja-JP
      timeZone: Asia/Tokyo
      currentTime: "2026-07-17T09:25:00+09:00"
      channel: agent
      grantedPolicies: []
      availableTools:
        - {
            name: create_codex_entry,
            schemaRef: "agent-tool-manifest.json#tool:create_codex_entry",
          }
      state:
        {
          conversationId: precheck-knowledge-policy-conversation,
          workspaceId: precheck-knowledge-policy-workspace,
          artifactRoot: precheck-knowledge-policy-artifacts,
        }
      teardown: [conversation, workspace, artifacts]
    input:
      {
        prompt: "知識書き込み無効のまま人物を登録して",
        attemptedTools: [create_codex_entry],
        executedTools: [],
      }
    expected:
      outcome: blocked
      blockedBy: policy-missing
      requiredTools: [create_codex_entry]
      forbiddenTools: []
      requiredPolicies: [knowledgeWrite]
      authorization: not-required
      failureClass: precheck
      freshness: current-project
      requiredEvidence: [policy-state]
      outputValidators: [no-side-effect, failure-class]

