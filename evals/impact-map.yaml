version: 1
allSuites:
  - quality-workflow
  - ai-routing
  - tool-policy
  - prompt-contract
  - retrieval-grounding
  - narrative-runtime
  - narrative-extraction
  - narrative-semantic-contract
rules:
  - id: quality-foundation
    reason: Quality policy, skills, selectors, and evaluation metadata affect every gate.
    paths:
      - AGENTS.md
      - .agents/skills/**
      - docs/communication-style-guide.md
      - policies/quality/**
      - evals/**
      - scripts/quality/**
    requirements:
      - GDX-ROUTE-001
      - GDX-AI-AUDIT-001
      - GDX-PRECHECK-001
      - GDX-AI-CONSENT-001
      - GDX-TOOL-001
      - GDX-POLICY-001
      - GDX-GROUND-001
      - GDX-ARTIFACT-001
      - GDX-ISOLATION-001
      - GDX-TRACE-001
    suites:
      - all
  - id: workflow-runtime
    reason: Dependency and CI workflow changes can alter every validation lane.
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/**
      - docs/DEVELOPMENT_SETUP.md
      - scripts/local-ci.mjs
      - scripts/local-ci-registry.json
      - scripts/local-ci.test.mjs
      - scripts/ci-pause.test.mjs
    requirements:
      - GDX-TRACE-001
    suites:
      - all
  - id: ai-routing
    reason: AI path, role, route, or provider changes must preserve complete routing coverage.
    paths:
      - src/features/ai-verification/**
      - docs/AI経路検証.md
      - src/features/chat/modelRouting.ts
      - src/features/chat/modelRouting.test.ts
      - src/features/chat/turn/**
      - src/features/chat/types.ts
    requirements:
      - GDX-ROUTE-001
      - GDX-AI-AUDIT-001
      - GDX-PRECHECK-001
      - GDX-AI-CONSENT-001
      - GDX-TRACE-001
    suites:
      - ai-routing
  - id: ai-audit-runtime
    reason: AI audit event ownership, pre-dispatch durability, and terminal capture must remain complete across every transport.
    paths:
      - src/features/ai-audit/**
      - src/features/chat/singleShotTransport.ts
      - src/features/chat/chatApi.ts
      - src/features/chat/chatStreamTransport.ts
      - src/features/chat/semanticRecall.ts
      - src/features/chat/semanticRerankerApply.ts
      - src/features/chat/semanticRerankerShadow.ts
      - src/features/chat/cliApi.ts
      - src/features/chat/codexAppApi.ts
      - src/features/chat/*.audit.test.ts
      - src/features/editor/inlineAi/**
      - src/features/editor/beat/**
      - src/features/ab-test/**
      - src/features/post-effect/api.ts
      - src/features/semantic-search/**
      - src/features/attribution/AttributionReport.tsx
      - src/features/attribution/AttributionProjectView.tsx
      - src/features/attribution/exportReport.ts
      - src/features/attribution/generationLogApi.ts
      - src/lib/browser-ai.ts
      - src/lib/browser-mock.ts
      - src/lib/browser-mock.ai-audit.test.ts
      - src/lib/browserRuntime*.ts
      - src/lib/browser-db/**
      - electron/shared/ipcContract.ts
      - electron/native/grimodex-node/src/lib.rs
      - electron/main/cliAi.ts
      - electron/main/codexAppServer/**
      - src-tauri/crates/grimodex-db/src/ai_audit.rs
      - src-tauri/crates/grimodex-db/tests/ai_audit.rs
      - src-tauri/crates/grimodex-post-effect/**
      - src-tauri/crates/grimodex-semantic/**
    requirements:
      - GDX-AI-AUDIT-001
      - GDX-ROUTE-001
      - GDX-TRACE-001
    suites:
      - quality-workflow
      - ai-routing
  - id: tool-policy
    reason: Tool schemas, policy gates, privacy, and execution adapters share one safety contract.
    paths:
      - agent-tool-manifest.json
      - src/features/ai-policy/**
      - src/features/chat/agent/**
      - src/features/chat/toolProtocolParse.ts
      - src-tauri/crates/grimodex-ai/build.rs
    requirements:
      - GDX-PRECHECK-001
      - GDX-AI-CONSENT-001
      - GDX-TOOL-001
      - GDX-POLICY-001
    suites:
      - tool-policy
  - id: localized-prompts
    reason: Localized prompts and shared output contracts require prompt validation.
    paths:
      - src/prompts/**
    requirements:
      - GDX-ROUTE-001
      - GDX-GROUND-001
      - GDX-ARTIFACT-001
    suites:
      - prompt-contract
  - id: post-effect-contracts
    reason: Post-effect payload builders, parsers, and UI contracts must remain aligned with their prompt output schema.
    paths:
      - src/features/post-effect/**
    requirements:
      - GDX-ROUTE-001
      - GDX-ARTIFACT-001
      - GDX-TRACE-001
    suites:
      - prompt-contract
  - id: retrieval-grounding
    reason: Recall, reranker admission authority, context planning, citation, and related-scene changes affect grounding.
    paths:
      - src/application/composition/chatContextPreparationComposition.ts
      - src/features/chat/chatRecall.ts
      - src/features/chat/chatRecall.test.ts
      - src/features/chat/chatRecallPromote.ts
      - src/features/chat/chatRecallPromote.test.ts
      - src/features/chat/citationVerify.ts
      - src/features/chat/citationVerify.test.ts
      - src/features/chat/hybridRecallSelection.ts
      - src/features/chat/semanticRecall.ts
      - src/features/chat/semanticRecall.test.ts
      - src/features/chat/semanticRerankerApply.ts
      - src/features/chat/semanticRerankerApply.test.ts
      - src/features/chat/semanticRerankerMode.ts
      - src/features/chat/semanticRerankerMode.test.ts
      - src/features/chat/semanticRerankerShadow.ts
      - src/features/chat/semanticRerankerShadow.test.ts
      - src/features/chat/context/**
      - src/features/chat/contextBuilder.chatRecall.test.ts
      - src/features/related-scenes/**
      - src/features/settings/types.ts
      - src/features/settings/categories/AiProjectSettings.tsx
      - src/features/settings/categories/AiProjectSettings.test.tsx
      - scripts/fixtures/**
    requirements:
      - GDX-GROUND-001
      - GDX-ISOLATION-001
    suites:
      - retrieval-grounding
  - id: narrative-semantic-contract
    reason: Narrative authority routes, state vocabulary, disclosure policy, and C2 authority boundaries share the C1.5 contract gate.
    paths:
      - docs/adr/002-phase-resolution-modes.md
      - docs/adr/004-narrative-reconciliation-boundary.md
      - docs/adr/005-narrative-semantic-core-boundary.md
      - docs/adr/006-narrative-mutation-authority-routes.md
      - docs/adr/009-narrative-scope-relation-contract.md
      - docs/adr/010-narrative-dependency-role-granularity-contract.md
      - docs/adr/011-narrative-ir-revision-semantics-contract.md
      - policies/narrative/**
      - src/features/narrative-semantic-core/**
      - src-tauri/crates/grimodex-core/src/canonical_json.rs
      - src-tauri/crates/grimodex-core/tests/canonical_json.rs
      - src-tauri/crates/grimodex-core/src/narrative_ir.rs
      - src-tauri/crates/grimodex-core/tests/narrative_ir.rs
      - src-tauri/crates/grimodex-core/src/narrative_dependency.rs
      - src-tauri/crates/grimodex-core/tests/narrative_dependency.rs
      - src/features/narrative-extraction/reconciler/stageExecution.ts
      - src/features/narrative-extraction/reconciler/stageExecution.test.ts
      - src/features/narrative-extraction/reconciler/types.ts
      - src/features/narrative-extraction/reconciler/v2Adapter.ts
      - src/features/narrative-extraction/reconciler/v2Adapter.test.ts
      - src/features/narrative-extraction/reconciler/chroniclePromptBuilder.ts
      - src/features/narrative-extraction/reconciler/chroniclePromptBuilder.test.ts
      - src/features/narrative-extraction/proposals/chronicleSceneEventAdapter.ts
      - src/features/narrative-extraction/proposals/chronicleSceneEventAdapter.test.ts
      - src/application/narrative-extraction/aiTasks/chronicleStageAudit.ts
      - src/application/narrative-extraction/aiTasks/chronicleStageAudit.test.ts
      - src/application/narrative-extraction/aiTasks/runObservationExtractionTask.ts
      - src/application/narrative-extraction/aiTasks/runEventSynthesisTask.ts
      - src/application/narrative-extraction/aiTasks/runStructuredRepairTask.ts
      - src/application/narrative-extraction/extractionCoordinator.ts
      - scripts/quality/validate-semantic-core-boundary.mjs
      - scripts/quality/validate-semantic-core-boundary.test.mjs
    requirements:
      - GDX-NARR-SEMANTIC-CONTRACT-001
      - GDX-ARTIFACT-001
    suites:
      - narrative-semantic-contract
  - id: narrative-extraction
    reason: Narrative source, Evidence, semantic scoring, Detail and Temporal projection contracts, Gold corpus, and Chronicle extraction changes share one release gate.
    paths:
      - src/features/narrative-extraction/**
      - src/application/narrative-extraction/aiTasks/**
      - src/application/narrative-extraction/extractionCoordinator.ts
      - src/application/narrative-extraction/temporal/**
      - src/features/chronicle/extractEventsApi.ts
      - src/features/chronicle/extractEventsApi.test.ts
      - src/features/chronicle/calendar/**
      - src/features/chronicle/calendarOcc.ts
      - src/features/chronicle/api.ts
