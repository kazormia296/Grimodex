      - src/features/revision/projectSnapshotApi.ts
      - src/features/revision/projectSnapshotApi.test.ts
      - src/features/revision/projectSnapshotNative.ts
      - src/features/revision/projectSnapshotScopes.ts
      - src/db/schema.ts
