        text: 玉座の背後には黒ずんだ儀礼剣が飾られていた。刃元の暗い染みは、遠目には乾いた血のようにも見えた。
      - id: scene-poison-needle-reveal
        title: 前夜の仕込み
        text: 前夜、侍医ロアンは毒針を王の杯の縁へ仕込んだ。翌朝の検分で、儀礼剣は鞘から抜かれておらず、黒ずみは古い錆だと判明した。
