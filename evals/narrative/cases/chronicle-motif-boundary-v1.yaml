        title: 壁の儀礼剣
        text: 謁見の間の壁には、刃こぼれした儀礼剣が一本掛けられていた。柄には王家の紋章が刻まれ、長いあいだ誰も触れていなかった。
      - id: scene-sword-use-recovered
        title: 地下牢の火
        text: 火の粉が梁へ移り、地下牢の出口が塞がれかけた。ミナは壁の儀礼剣を引き抜き、捕虜を縛る縄を切った。捕虜は煙の薄い階段へ逃れた。
    expected:
      observations:
        required:
          - id: required-mina-cut-prisoner-rope
            semanticKey: mina-cut-prisoner-rope
            dimensions:
              eventDetection: true
              actuality: actual
              attribution: narrator
              narrativeFrame: story-world
              evidence:
                - documentId: scene-sword-use-recovered
                  quote: ミナは壁の儀礼剣を引き抜き、捕虜を縛る縄を切った。
              clustering: mina-cut-prisoner-rope
              significance: major
              proposalGate: propose
        forbidden:
