heavyEvaluations:
  - id: heavy-agent-tool-loop
    suiteId: tool-policy
    command: OPENROUTER_API_KEY=... pnpm test:node --run src/features/chat/agent/agentToolCall.live.test.ts
    reason: Preserved desktop-route validation; requires billed OpenRouter access and an isolated workspace, and is not a managed Web Editor route.
  - id: heavy-single-shot-surfaces
    suiteId: ai-routing
    command: OPENROUTER_API_KEY=... pnpm test:node --run src/features/ai-verification/singleShot.live.test.ts
    reason: Preserved desktop-route validation; requires billed OpenRouter access, and missing credentials must not become a pass.
  - id: heavy-related-scenes
    suiteId: retrieval-grounding
    command: EMBED_NODE_MODULES=... EMBED_RES_DIR=... node scripts/quality/run-related-scenes-heavy.mjs
    reason: Requires local ONNX runtime dependencies and model resources; the runner generates verified embeddings, executes the eval, and restores prior artifacts.
  - id: heavy-semantic-reranker-fixed-fixture
    suiteId: retrieval-grounding
    command: cd experiments/lfm25-encoder-phase0 && HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 uv run --frozen --no-dev python -m grimodex_lfm_eval.reranker_gate2_runner --config configs/phase0b-rerankers.yaml --candidates data/public/gate2/candidates-ja.jsonl --chunk-qrels data/public/gate2/chunk-qrels.json --model ja_xsmall --threads 4 --batch-size 4 --output /tmp/grimodex-gate2-ja-xsmall.json && HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 uv run --frozen --no-dev python -m grimodex_lfm_eval.reranker_gate2_runner --config configs/phase0b-rerankers.yaml --candidates data/public/gate2/candidates-en.jsonl --chunk-qrels data/public/gate2/chunk-qrels.json --model en_minilm_l4 --threads 4 --batch-size 4 --output /tmp/grimodex-gate2-en-minilm-l4.json
    reason: Product opt-in depends on the pinned Gate 2 quality, admission-safety, and top-30 CPU latency gates; requires verified local model snapshots and a comparable CPU host.
  - id: heavy-impact-gate31
    suiteId: retrieval-grounding
    command: make -C experiments/lfm25-encoder-phase0 impact-gate31 IMPACT_GATE31_MODEL=ja_xsmall IMPACT_GATE31_FINAL_BATCH_SIZE=4 IMPACT_GATE31_FINAL_THREAD_COUNT=8 IMPACT_GATE31_FINAL_BUCKET_MODE=bucketed && make -C experiments/lfm25-encoder-phase0 impact-gate31 IMPACT_GATE31_MODEL=modernbert_ja_30m IMPACT_GATE31_FINAL_BATCH_SIZE=4 IMPACT_GATE31_FINAL_THREAD_COUNT=physical IMPACT_GATE31_FINAL_BUCKET_MODE=bucketed
    reason: Requires both pinned local FP32 model snapshots and several minutes of isolated CPU time to measure every window from 30 complete scenes plus the saturated 30-window stress.
  - id: heavy-rust-post-effect-live
    suiteId: prompt-contract
    command: OPENROUTER_API_KEY=... cargo test --manifest-path src-tauri/Cargo.toml --no-default-features post_effect_live -- --nocapture
    reason: Preserved desktop Rust-route validation; requires a billed OpenRouter model and isolated credentials.
  - id: heavy-codex-prompt-surfaces
    suiteId: prompt-contract
    command: OPENROUTER_API_KEY=... pnpm test:node --run src/features/codex/candidateJudgment.live.test.ts src/features/codex/codexYomi.live.test.ts
    reason: Preserved desktop prompt-surface validation; requires a billed OpenRouter model, and wording checks alone are Light evidence.
blockedEvaluations:
  - id: blocked-impact-gate4-fresh-holdout
    suiteId: retrieval-grounding
    reason: The current synthetic test fingerprint is consumed and Gate 3.1 full-scene latency is Hold, so changing the run output cannot authorize another locked-test evaluation.
    requiredAction: First pass the same Gate 3.1 full-scene workload, then freeze a new work-isolated holdout and intentionally update the selection protocol identity before registering a new runnable Heavy command.
  - id: blocked-web-ai-consent-live
    suiteId: tool-policy
    reason: No isolated browser runner proves the consent dialog, refusal-before-provider behavior, and teardown against a real user-selected HTTP Local LLM or BYOK provider.
    requiredAction: Add disposable user-owned provider credentials or an isolated Local LLM endpoint, refusal and re-consent assertions, and deterministic teardown before promoting this gap to heavyEvaluations.
