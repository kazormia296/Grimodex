      - eval-artifact-update-codex
      - eval-policy-create-snippet
      - eval-policy-apply-tree
      - eval-prompt-post-effect-json
  - id: GDX-ISOLATION-001
    title: Evaluation cases own independent context, state, artifacts, and teardown.
    definedIn: policies/quality/iron-laws.md#GDX-ISOLATION-001
    implementedBy:
      - scripts/quality/eval-fixtures.mjs
      - evals/fixtures/routing.yaml
    lightTests:
      - scripts/quality/eval-fixtures.test.mjs
    heavyTests:
      - src/features/chat/agent/agentToolCall.live.test.ts
    evaluatedBy:
      - eval-ground-search-events
      - eval-route-search-codex
      - eval-isolation-ask-user
  - id: GDX-TRACE-001
    title: Requirements, changes, suites, results, failures, and deferred work remain linked.
    definedIn: policies/quality/iron-laws.md#GDX-TRACE-001
    implementedBy:
      - scripts/quality/impact-map.mjs
      - evals/impact-map.yaml
      - src/features/ai-verification/aiPathRegistry.ts
    lightTests:
      - scripts/quality/impact-map.test.mjs
      - src/features/ai-verification/aiPathRegistry.test.ts
      - src/features/ai-verification/aiPathRegistry.webEditor.test.ts
    heavyTests:
      - src/features/ai-verification/singleShot.live.test.ts
    evaluatedBy:
      - eval-ground-foreshadow
      - eval-artifact-create-event
      - eval-prompt-post-effect-json
      - eval-route-search-scenes
heavyEvaluations:
  - id: heavy-agent-tool-loop
    suiteId: tool-policy
    command: OPENROUTER_API_KEY=... pnpm test:node --run src/features/chat/agent/agentToolCall.live.test.ts
    reason: Preserved desktop-route validation; requires billed OpenRouter access and an isolated workspace, and is not a managed Web Editor route.
  - id: heavy-single-shot-surfaces
    suiteId: ai-routing
    command: OPENROUTER_API_KEY=... pnpm test:node --run src/features/ai-verification/singleShot.live.test.ts
    reason: Preserved desktop-route validation; requires billed OpenRouter access, and missing credentials must not become a pass.
  - id: heavy-related-scenes
    suiteId: retrieval-grounding
    command: EMBED_NODE_MODULES=... EMBED_RES_DIR=... node scripts/quality/run-related-scenes-heavy.mjs
    reason: Requires local ONNX runtime dependencies and model resources; the runner generates verified embeddings, executes the eval, and restores prior artifacts.
  - id: heavy-rust-post-effect-live
    suiteId: prompt-contract
    command: OPENROUTER_API_KEY=... cargo test --manifest-path src-tauri/Cargo.toml --no-default-features post_effect_live -- --nocapture
    reason: Preserved desktop Rust-route validation; requires a billed OpenRouter model and isolated credentials.
  - id: heavy-codex-prompt-surfaces
    suiteId: prompt-contract
    command: OPENROUTER_API_KEY=... pnpm test:node --run src/features/codex/candidateJudgment.live.test.ts src/features/codex/codexYomi.live.test.ts
    reason: Preserved desktop prompt-surface validation; requires a billed OpenRouter model, and wording checks alone are Light evidence.
blockedEvaluations:
  - id: blocked-web-ai-consent-live
    suiteId: tool-policy
    reason: No isolated browser runner proves the consent dialog, refusal-before-provider behavior, processor disclosure, and teardown against a real user-selected Local LLM or BYOK provider.
    requiredAction: Add disposable user-owned provider credentials or an isolated Local LLM endpoint, a browser runner, refusal and re-consent assertions, and deterministic teardown before promoting this gap to heavyEvaluations.
