heavyEvaluations:
  - id: heavy-c2-5b-narrative-maintenance-product-journeys
    suiteId: narrative-runtime
    command: GRIMODEX_PRODUCT_JOURNEY_SET=c2-5b pnpm electron:product-journeys
    reason: Runs the eleven durable C2-5B maintenance journeys in a built Electron/native environment; missing trigger owners or production adapters remain an intentional red acceptance result until the corresponding implementation lanes land.
  - id: heavy-agent-tool-loop
    suiteId: tool-policy
    command: pnpm test:node --run src/features/chat/agent/agentToolCall.live.test.ts
    reason: Maintainer-local live model qualification for the desktop agent loop; requires billed OpenRouter access and an isolated workspace, and is not a managed Web Editor route.
  - id: heavy-single-shot-surfaces
    suiteId: ai-routing
    command: pnpm test:node --run src/features/ai-verification/singleShot.live.test.ts
    reason: Maintainer-local live model qualification for desktop single-shot surfaces; missing credentials produce INCOMPLETE, never QUALIFIED.
  - id: heavy-related-scenes
    suiteId: retrieval-grounding
    command: node scripts/quality/run-related-scenes-heavy.mjs
    reason: Requires local ONNX runtime dependencies and model resources; the runner generates verified embeddings, executes the eval, and restores prior artifacts.
  - id: heavy-semantic-reranker-fixed-fixture
    suiteId: retrieval-grounding
    command: cd experiments/lfm25-encoder-phase0 && HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 uv run --frozen --no-dev python -m grimodex_lfm_eval.reranker_gate2_runner --config configs/phase0b-rerankers.yaml --candidates data/public/gate2/candidates-ja.jsonl --chunk-qrels data/public/gate2/chunk-qrels.json --model ja_xsmall --threads 4 --batch-size 4 --output /tmp/grimodex-gate2-ja-xsmall.json && HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 uv run --frozen --no-dev python -m grimodex_lfm_eval.reranker_gate2_runner --config configs/phase0b-rerankers.yaml --candidates data/public/gate2/candidates-en.jsonl --chunk-qrels data/public/gate2/chunk-qrels.json --model en_minilm_l4 --threads 4 --batch-size 4 --output /tmp/grimodex-gate2-en-minilm-l4.json
    reason: Product opt-in depends on the pinned Gate 2 quality, admission-safety, and top-30 CPU latency gates; requires verified local model snapshots and a comparable CPU host.
  - id: heavy-impact-gate31
    suiteId: retrieval-grounding
    command: make -C experiments/lfm25-encoder-phase0 impact-gate31 IMPACT_GATE31_MODEL=ja_xsmall IMPACT_GATE31_FINAL_BATCH_SIZE=4 IMPACT_GATE31_FINAL_THREAD_COUNT=8 IMPACT_GATE31_FINAL_BUCKET_MODE=bucketed && make -C experiments/lfm25-encoder-phase0 impact-gate31 IMPACT_GATE31_MODEL=modernbert_ja_30m IMPACT_GATE31_FINAL_BATCH_SIZE=4 IMPACT_GATE31_FINAL_THREAD_COUNT=physical IMPACT_GATE31_FINAL_BUCKET_MODE=bucketed
    reason: Requires both pinned local FP32 model snapshots and several minutes of isolated CPU time to measure every window from 30 complete scenes plus the saturated 30-window stress.
  - id: heavy-rust-post-effect-live
    suiteId: prompt-contract
    command: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features post_effect_live -- --nocapture
    reason: Maintainer-local live model qualification for the desktop Rust route; requires a billed OpenRouter model and isolated credentials.
  - id: heavy-codex-prompt-surfaces
    suiteId: prompt-contract
    command: pnpm test:node --run src/features/codex/candidateJudgment.live.test.ts src/features/codex/codexYomi.live.test.ts
    reason: Maintainer-local live model qualification for desktop prompt surfaces; requires a billed OpenRouter model, while wording checks remain Light evidence.
  - id: heavy-narrative-chronicle-production
