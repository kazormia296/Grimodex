version: 1
failureClasses:
  - routing
  - precheck
  - tool
  - policy
  - quality
  - artifact
lightSuites:
  - quality-workflow
  - ai-routing
  - tool-policy
  - prompt-contract
  - retrieval-grounding
requirements:
