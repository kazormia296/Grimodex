      - scripts/quality/run-related-scenes-heavy.mjs
    evaluatedBy:
      - eval-ground-search-events
      - eval-ground-get-scene
      - eval-ground-foreshadow
      - eval-tool-research
  - id: GDX-ARTIFACT-001
    title: Structured and generated outputs pass schema and provenance validation.
    definedIn: policies/quality/iron-laws.md#GDX-ARTIFACT-001
    implementedBy:
      - src/features/chat/agent/toolExecutors.ts
      - src/features/chat/agent/chronicleWriteTools.ts
      - src/features/post-effect/api.ts
      - src/features/post-effect/canonicalize.ts
    lightTests:
      - src/features/chat/agent/toolExecutors.test.ts
      - src/features/chat/agent/chronicleWriteTools.test.ts
