    definedIn: policies/quality/iron-laws.md#GDX-ROUTE-001
    implementedBy:
      - src/features/ai-verification/aiPathRegistry.ts
      - src/features/chat/modelRouting.ts
      - src/features/chat/turn/resolveTurnRoute.ts
      - src/features/chat/chatStore.ts
    lightTests:
      - src/features/ai-verification/aiPathRegistry.test.ts
      - src/features/ai-verification/aiPathRegistry.webEditor.test.ts
      - src/features/chat/modelRouting.test.ts
      - src/features/chat/turn/resolveTurnRoute.test.ts
      - src/features/chat/chatApi.test.ts
      - src/features/chat/chatStore.test.ts
    heavyTests:
      - src/features/ai-verification/singleShot.live.test.ts
      - src-tauri/src/commands/post_effect.rs
    evaluatedBy:
      - eval-prompt-post-effect-json
      - eval-route-search-codex
      - eval-route-search-scenes
      - eval-route-list-chapters
      - eval-route-character-timeline
  - id: GDX-PRECHECK-001
    title: Missing inputs, policies, confirmation, or tools stop before mutation.
    definedIn: policies/quality/iron-laws.md#GDX-PRECHECK-001
    implementedBy:
      - src/features/chat/turn/resolveTurnRoute.ts
      - src/features/chat/context/chatContextPlanner.ts
      - src/features/ai-policy/policyGuard.ts
    lightTests:
      - src/features/chat/turn/resolveTurnRoute.test.ts
      - src/features/chat/context/chatContextPlanner.test.ts
      - src/features/ai-policy/policyGuard.test.ts
    heavyTests:
      - src/features/chat/agent/agentToolCall.live.test.ts
    evaluatedBy:
      - eval-precheck-knowledge-policy
      - eval-precheck-body-confirmation
      - eval-precheck-delete-confirmation
      - eval-route-character-timeline
      - eval-tool-unknown
      - eval-isolation-ask-user
  - id: GDX-AI-CONSENT-001
    title: External AI data use is fully disclosed and explicitly consented before dispatch.
    definedIn: policies/quality/iron-laws.md#GDX-AI-CONSENT-001
    implementedBy:
      - src/features/ai-policy/aiDataConsentBroker.ts
      - src/features/ai-policy/aiDataConsent.ts
