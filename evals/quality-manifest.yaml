      - src/features/ai-policy/aiDataConsentBroker.test.ts
      - src/features/ai-policy/AiDataConsentDialog.test.tsx
      - src/features/ai-policy/browserAiDisclosure.test.ts
      - src/features/chat/browserProviderPolicy.test.ts
      - src/features/hosted-editor/WebEditorAiCategory.test.tsx
      - src/features/legal/constants.test.ts
      - src/lib/browser-ai.test.ts
      - src/lib/browser-mock.ai-runtime.test.ts
      - src/features/ai-verification/aiPathRegistry.test.ts
