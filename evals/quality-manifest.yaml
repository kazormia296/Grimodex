      - src/features/chat/agent/toolManifest.ts
      - src/features/chat/agent/toolDefinitions.ts
      - src-tauri/crates/grimodex-ai/build.rs
    lightTests:
      - src/features/chat/agent/toolDefinitions.test.ts
      - src/features/chat/agent/toolExecutors.test.ts
      - scripts/quality/impact-map.mjs
    heavyTests:
